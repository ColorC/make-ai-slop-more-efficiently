services:
  app:
    build:
      context: ../..
      dockerfile: deploy/game-observatory/Dockerfile
    restart: unless-stopped
    environment:
      OMNI_GAME_OBSERVATORY_TOKENS: ${OMNI_GAME_OBSERVATORY_TOKENS:-{}}
    volumes:
      - ../../data/domains/game_observatory:/app/data/domains/game_observatory
    expose:
      - "8222"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8222/api/game-observatory/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8222:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

