limit_req_zone $binary_remote_addr zone=write_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 4m;
    gzip on;
    gzip_types application/json application/javascript text/css text/html text/plain application/xml;

    location ~ ^/api/game-observatory/(actions|capture|capture-stream|packages|mumu|gateway|leases|sources|voices|patches|annotations) {
        limit_req zone=write_limit burst=20 nodelay;
        proxy_pass http://app:8222;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8222;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
