[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omni-recover"
version = "0.1.0a2"
description = "Byte-safe cross-provider recovery from AI coding-session evidence"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "omni-recover contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
omni-recover = "omnicompany.packages.services.recovery.entrypoint:main"

[project.entry-points."omni_recover.providers"]
# Third-party distributions register read-only ProviderAdapter factories here.

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true
