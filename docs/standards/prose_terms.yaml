# forbidden_aliases: 本该用中文、却常被写成英文的"代称"。en 命中即报, 建议改成 zh。
forbidden_aliases:
  - en: "done"
    zh: "完成 / 做完"
  - en: "TODO"
    zh: "待办(列入 whatnow 或本模块 TODO 自标可保留)"
  - en: "WIP"
    zh: "进行中"
  - en: "OK"
    zh: "好 / 可以 / 没问题"

# ── 轨二第二类 · 术语一致 / 代称混乱 / 易过时引用 ─────────────────────
# term_consistency: 同一概念的规范写法 + 变体。出现变体 → 建议统一到 canonical。
# easily_outdated: 该指代易过时, 命中提示换稳定指代。
term_consistency:
  - canonical: "性价比模型"
    variants: ["便宜模型", "廉价模型", "小模型"]
    note: "指 deepseek/qwen 这类成本低的结构化输出模型"
  - canonical: "进度真源"
    variants: ["进度来源", "状态真源"]
    note: "whatnow 是进度唯一真源"
  - canonical: "审阅台"
    variants: ["审查台", "review台", "评审台"]
    note: "reviewstage / human-inbox"
  - canonical: "纳管"
    variants: ["纳入管理", "收编进", "归管"]
    note: "把计划纳入 whatnow 跟踪"

easily_outdated:
  - pattern: "目前"
    note: "相对时间词, 写一段时间就过时; 改成绝对日期或删"
  - pattern: "最新版"
    note: "相对版本, 改成具体版本号或 commit"
  - pattern: "刚才"
    note: "相对时间, 不可被未来读者解析"

# ── 轨二第三类 · 惜字如金 ──────────────────────────────────────────────
# abbrev_expansions: 已知的"压缩单字/短代称" → 完整正常说法。确定性一对一展开。
abbrev_expansions:
  - short: "好恶词"
    full: "表达了用户喜好或厌恶的词汇"
  - short: "增删改"
    full: "新增、删除、修改"
  - short: "起服"
    full: "启动服务"
