<title>决策轨迹样张 v2 · 泳道单程向右流</title>
<style>
  :root{
    --bg:#0b0e14;
    --panel:rgba(255,255,255,.04);
    --panel-2:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.12);
    --border-soft:rgba(255,255,255,.07);
    --ink:#dde3ee;
    --ink-dim:#9aa3b5;
    --ink-faint:#6b7385;
    --accent:#4c8dff;
    /* 三条泳道冷色系 */
    --lane-a:#59b6c9;   /* 界面一览 青 */
    --lane-b:#7c8cf8;   /* 可玩演示 靛蓝 */
    --lane-c:#4c8dff;   /* 设计评审 亮蓝 */
    --ok:#57c98a;
    --warn:#e0b95a;
    --pending:#9aa3b5;
    --ease:cubic-bezier(.4,.8,.3,1);
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 78% -8%, rgba(76,141,255,.10), transparent 60%),
      radial-gradient(900px 600px at 8% 110%, rgba(124,140,248,.08), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    font-size:13px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;gap:20px;
    padding:12px 22px;
    background:var(--panel);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
    z-index:6;
  }
  .brand{display:flex;flex-direction:column;gap:1px;margin-right:6px;}
  .brand .t{font-size:15px;font-weight:600;letter-spacing:.3px;}
  .brand .s{font-size:12px;color:var(--ink-faint);}
  .seg{display:flex;align-items:center;gap:8px;}
  .seg-label{font-size:12px;color:var(--ink-faint);}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:5px 12px;border-radius:999px;
    background:var(--panel-2);border:1px solid var(--border);
    font-size:12px;color:var(--ink);cursor:default;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .legend{display:flex;align-items:center;gap:16px;margin-left:auto;}
  .legend .item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-dim);}
  .legend .lane-mark{width:14px;height:14px;border-radius:5px;position:relative;}
  .legend .lane-mark::after{content:"";position:absolute;inset:0;border-radius:5px;border:1px solid rgba(255,255,255,.28);}

  /* ---------- 主区 ---------- */
  .main{position:relative;flex:1 1 auto;display:flex;min-height:0;}

  /* 泳道画布 */
  .canvas-wrap{position:relative;flex:1 1 auto;min-width:0;overflow:auto;}
  .stage{position:relative;}

  /* 顶部时间刻度 */
  .time-axis{
    position:absolute;top:0;height:var(--axis-h);
    z-index:3;pointer-events:none;
  }
  .time-axis .tick{
    position:absolute;top:0;height:100%;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding-bottom:7px;
  }
  .time-axis .tick .lbl{
    font-size:12px;color:var(--ink-faint);white-space:nowrap;
    font-variant-numeric:tabular-nums;transform:translateX(-2px);
  }
  .time-axis .tick .stalk{
    position:absolute;top:26px;bottom:0;left:0;width:1px;
    background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0));
  }

  /* 泳道色带(横向) */
  .lane-band{
    position:absolute;left:0;right:0;height:var(--lane-h);
    z-index:0;
  }
  .lane-band .fill{
    position:absolute;inset:0;
    background:linear-gradient(90deg, var(--laneglow) 0%, rgba(255,255,255,.012) 46%, rgba(255,255,255,0) 100%);
    border-top:1px solid rgba(255,255,255,.05);
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  /* 左端竖排道名 */
  .lane-name{
    position:absolute;left:0;top:0;bottom:0;width:var(--lane-gutter);
    z-index:2;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(90deg, rgba(11,14,20,.94), rgba(11,14,20,.62));
    border-right:1px solid var(--border-soft);
  }
  .lane-name .txt{
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:13px;letter-spacing:6px;font-weight:600;
    color:var(--lanecolor);
    text-shadow:0 0 14px var(--laneshadow);
  }
  .lane-name .accent{
    position:absolute;left:0;top:14%;bottom:14%;width:3px;border-radius:0 3px 3px 0;
    background:var(--lanecolor);box-shadow:0 0 10px var(--lanecolor);
  }

  /* SVG 流线层 */
  .flow-svg{position:absolute;top:0;left:0;z-index:1;pointer-events:none;}
  .flow-supersede{fill:none;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--flowglow));}
  .flow-related{fill:none;stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round;opacity:.85;}
  .flow-tip{fill:var(--tipcolor);}

  /* 材料卡片=节点本身 */
  .cards{position:absolute;top:0;left:0;z-index:4;}
  .card{
    position:absolute;
    width:var(--card-w);min-height:var(--card-h);
    display:flex;flex-direction:column;gap:8px;
    padding:11px 13px;
    background:linear-gradient(180deg, rgba(24,29,40,.92), rgba(17,21,30,.92));
    border:1px solid var(--border-soft);
    border-left:3px solid var(--cardaccent,var(--accent));
    border-radius:11px;
    cursor:pointer;
    box-shadow:0 8px 22px rgba(0,0,0,.34);
    transition:border-color .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .card:hover{
    border-color:var(--border);border-left-color:var(--cardaccent);
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(0,0,0,.45), 0 0 0 1px var(--cardaccent)33;
  }
  .card.active{
    border-color:var(--cardaccent);
    box-shadow:0 12px 30px rgba(0,0,0,.5), 0 0 0 1px var(--cardaccent);
  }
  .card .title{
    font-size:13px;color:var(--ink);line-height:1.5;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:12px;padding:1px 8px;border-radius:6px;
    border:1px solid var(--border-soft);color:var(--ink-dim);
    background:rgba(255,255,255,.03);white-space:nowrap;
  }
  .badge.kind{color:var(--ink);}
  .badge.ver{font-variant-numeric:tabular-nums;}
  .badge.st-accepted{color:var(--ok);border-color:rgba(87,201,138,.35);background:rgba(87,201,138,.08);}
  .badge.st-pending{color:var(--warn);border-color:rgba(224,185,90,.32);background:rgba(224,185,90,.07);}
  .badge .ic{width:12px;height:12px;display:inline-block;}
  .card .foot{display:flex;align-items:center;gap:10px;margin-top:auto;}
  .card .time{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .cmt{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-faint);margin-left:auto;}
  .cmt svg{opacity:.75;}

  /* 决策过程标记(骑在 v1->v2 流线上,略上浮,拖一根引线到线上,不遮住流线) */
  .dec-badge{
    position:absolute;z-index:6;
    display:inline-flex;align-items:center;gap:7px;
    padding:6px 11px 6px 9px;border-radius:9px;
    background:linear-gradient(135deg, rgba(40,46,78,.98), rgba(31,36,62,.98));
    border:1px solid rgba(124,140,248,.6);
    color:#cdd8ff;font-size:12px;cursor:pointer;white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    transform:translate(-50%,-100%);
    transition:box-shadow .15s var(--ease), border-color .15s var(--ease);
  }
  /* 引线:从徽章底部中心向下连到流线 */
  .dec-badge::after{
    content:"";position:absolute;left:50%;top:100%;
    width:2px;height:var(--leader,16px);
    background:linear-gradient(180deg, rgba(124,140,248,.9), rgba(124,140,248,.35));
    transform:translateX(-50%);
  }
  .dec-badge::before{
    content:"";position:absolute;left:50%;bottom:calc(-1 * var(--leader,16px) - 3px);
    width:7px;height:7px;border-radius:50%;
    background:#8f9dff;box-shadow:0 0 8px #8f9dff;
    transform:translateX(-50%);
  }
  .dec-badge:hover{border-color:rgba(124,140,248,.95);box-shadow:0 6px 22px rgba(70,95,225,.5);}
  .dec-badge .flag{width:13px;height:13px;color:#8f9dff;}
  .dec-badge .n{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:17px;height:17px;padding:0 4px;border-radius:6px;
    background:rgba(124,140,248,.3);color:#e6ebff;font-size:12px;font-variant-numeric:tabular-nums;
  }

  /* ---------- 右滑面板(沿用第一版) ---------- */
  .scrim{position:absolute;inset:0;background:rgba(4,6,10,.5);opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:8;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .drawer{
    position:absolute;top:0;right:0;height:100%;width:440px;max-width:88vw;
    background:linear-gradient(180deg, rgba(20,24,34,.92), rgba(14,17,25,.94));
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-left:1px solid var(--border);
    transform:translateX(100%);transition:transform .28s var(--ease);
    z-index:9;display:flex;flex-direction:column;
    box-shadow:-24px 0 60px rgba(0,0,0,.5);
  }
  .drawer.open{transform:translateX(0);}
  .drawer .dh{
    display:flex;align-items:flex-start;gap:12px;
    padding:20px 22px 16px;border-bottom:1px solid var(--border-soft);flex:0 0 auto;
  }
  .drawer .dh .dh-tag{font-size:12px;color:var(--ink-faint);letter-spacing:.4px;text-transform:uppercase;}
  .drawer .dh h2{margin:6px 0 0;font-size:15px;font-weight:600;line-height:1.5;color:var(--ink);}
  .drawer .close{
    margin-left:auto;flex:0 0 auto;width:30px;height:30px;border-radius:8px;
    border:1px solid var(--border-soft);background:var(--panel);color:var(--ink-dim);
    cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;
  }
  .drawer .close:hover{background:var(--panel-2);color:var(--ink);}
  .drawer .dbody{overflow:auto;padding:18px 22px 28px;flex:1 1 auto;}

  .field-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .sec-title{font-size:12px;color:var(--ink-faint);letter-spacing:.5px;margin:22px 0 11px;display:flex;align-items:center;gap:8px;}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--border-soft);}

  .cmt-list{display:flex;flex-direction:column;gap:10px;}
  .cmt-item{background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:11px 13px;}
  .cmt-item .ch{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .cmt-item .au{font-size:12px;color:var(--ink);font-weight:500;}
  .cmt-item .ct{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-left:auto;}
  .cmt-item .cc{font-size:13px;color:var(--ink-dim);}
  .empty{font-size:13px;color:var(--ink-faint);padding:8px 0;}

  .open-link{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 15px;border-radius:9px;
    background:rgba(76,141,255,.14);border:1px solid rgba(76,141,255,.4);
    color:#bcd2ff;font-size:13px;cursor:pointer;text-decoration:none;
    transition:background .15s;
  }
  .open-link:hover{background:rgba(76,141,255,.22);}

  /* 决策过程面板块 */
  .dec-block{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;
    padding:15px 16px;margin-bottom:14px;position:relative;overflow:hidden;
  }
  .dec-block::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#7c8cf8,#4c8dff);}
  .dec-block .dtop{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .dec-block .did{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .dec-block .dstate{
    margin-left:auto;font-size:12px;padding:2px 9px;border-radius:6px;
    color:var(--ink-dim);border:1px solid var(--border-soft);background:rgba(255,255,255,.03);
  }
  .dec-block .dstate.proposed{color:var(--warn);border-color:rgba(224,185,90,.3);background:rgba(224,185,90,.07);}
  .dec-block .dstate.adopted{color:var(--ok);border-color:rgba(87,201,138,.3);background:rgba(87,201,138,.07);}
  .dec-block .stmt{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:12px;}
  .quote{
    font-size:12px;color:var(--ink-dim);line-height:1.6;
    border-left:2px solid rgba(124,140,248,.5);padding:4px 10px 4px 12px;margin:10px 0;
    background:rgba(124,140,248,.05);border-radius:0 6px 6px 0;
  }
  .quote .qh{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:3px;}
  .opts{display:flex;flex-direction:column;gap:7px;margin-top:11px;}
  .opt{
    display:flex;gap:9px;align-items:flex-start;
    padding:9px 11px;border-radius:9px;font-size:12px;line-height:1.55;
    border:1px solid var(--border-soft);background:rgba(255,255,255,.02);
  }
  .opt.chosen{border-color:rgba(87,201,138,.35);background:rgba(87,201,138,.06);}
  .opt.rejected{opacity:.9;}
  .opt .mk{flex:0 0 auto;width:16px;height:16px;margin-top:1px;}
  .opt .otext{min-width:0;}
  .opt .oname{color:var(--ink);}
  .opt.chosen .oname{color:#a7e6c2;}
  .opt.rejected .oname{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25);}
  .opt .owhy{color:var(--ink-faint);margin-top:3px;font-size:12px;}
  .opt .owhy b{color:var(--ink-dim);font-weight:500;}

  /* ---------- 域共同沉淀侧栏 ---------- */
  .domain-toggle{
    position:absolute;top:16px;right:18px;z-index:7;
    display:inline-flex;align-items:center;gap:9px;
    padding:8px 14px;border-radius:10px;
    background:var(--panel);border:1px solid var(--border);
    color:var(--ink-dim);font-size:12px;cursor:pointer;
    backdrop-filter:blur(10px);
    transition:background .15s,color .15s,border-color .15s;
  }
  .domain-toggle:hover{background:var(--panel-2);color:var(--ink);border-color:rgba(255,255,255,.2);}
  .domain-toggle .badge-n{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;height:18px;padding:0 5px;border-radius:6px;
    background:rgba(76,141,255,.22);color:#bcd2ff;font-size:12px;
  }
  .domain{
    position:absolute;top:0;right:0;height:100%;width:400px;max-width:86vw;
    background:linear-gradient(180deg, rgba(18,22,32,.94), rgba(13,16,24,.95));
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-left:1px solid var(--border);
    transform:translateX(100%);transition:transform .28s var(--ease);
    z-index:9;display:flex;flex-direction:column;
    box-shadow:-24px 0 60px rgba(0,0,0,.5);
  }
  .domain.open{transform:translateX(0);}
  .domain .dh{padding:20px 20px 15px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;gap:10px;}
  .domain .dh .t{font-size:14px;font-weight:600;color:var(--ink);}
  .domain .dh .s{font-size:12px;color:var(--ink-faint);margin-top:4px;line-height:1.5;}
  .domain .dbody{overflow:auto;padding:14px 18px 26px;flex:1;}
  .dr-item{
    border:1px solid var(--border-soft);border-radius:10px;margin-bottom:10px;
    background:var(--panel);overflow:hidden;
  }
  .dr-head{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;cursor:pointer;transition:background .15s;}
  .dr-head:hover{background:var(--panel-2);}
  .dr-head .dr-id{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;flex:0 0 auto;padding-top:1px;}
  .dr-head .dr-st{font-size:13px;color:var(--ink);line-height:1.5;flex:1;}
  .dr-head .caret{flex:0 0 auto;color:var(--ink-faint);transition:transform .2s var(--ease);margin-top:2px;}
  .dr-item.exp .caret{transform:rotate(90deg);}
  .dr-detail{max-height:0;overflow:hidden;transition:max-height .28s var(--ease);}
  .dr-item.exp .dr-detail{max-height:640px;}
  .dr-detail .inner{padding:2px 13px 14px;border-top:1px solid var(--border-soft);}
  .dr-detail .anchor{font-size:12px;color:var(--ink-faint);margin:10px 0 8px;word-break:break-all;}
  .dr-detail .anchor b{color:var(--ink-dim);font-weight:500;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:6px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);background-clip:content-box;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>

  {name:"可玩演示", raw:"#7c8cf8"},

const laneIndex = n => LANES.findIndex(l=>l.name===n);
const laneColor = n => LANES[laneIndex(n)].raw;

const KIND_LABEL = {image:"界面图", demo:"可玩演示", markdown:"评审文档", html:"网页"};

function fmtTime(iso){
  const d = new Date(iso);
  const p = n => String(n).padStart(2,"0");
  return `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDay(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

/* ===================== 布局常量 ===================== */
const LANE_GUTTER = 52;    // 左端道名带宽
const LANE_H      = 158;   // 每条泳道带高
const AXIS_H      = 48;    // 顶部时间刻度高
const CARD_W      = 244;   // 卡片宽
const CARD_H      = 92;    // 卡片最小高
const COL_W       = 300;   // 时间列间距(严格列网格) = 卡宽244 + 列间56 流线空间
const COL_LEFT    = LANE_GUTTER + 40;  // 第一列卡片左缘

document.documentElement.style.setProperty("--lane-gutter", LANE_GUTTER+"px");
document.documentElement.style.setProperty("--lane-h", LANE_H+"px");
document.documentElement.style.setProperty("--axis-h", AXIS_H+"px");
document.documentElement.style.setProperty("--card-w", CARD_W+"px");
document.documentElement.style.setProperty("--card-h", CARD_H+"px");

/* 时间从旧到新:左→右。严格列网格:每张卡独占一列,单程向右,永不并列堆叠。
   这样承袭沿泳道直行、派生跨泳道向右分出,都读得出"流"。 */
const materials = [...DATA.materials].sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
const idIndex = {};
materials.forEach((m,i)=> idIndex[m.id]=i);

const colOf = {};
materials.forEach((m,i)=> colOf[m.id]=i);   // 一卡一列,严格列网格
const N_COLS = materials.length;

/* 卡片几何:x 由时间列决定(严格列网格),y 由泳道决定(卡片竖直居中在自己泳道带) */
function cardX(m){ return COL_LEFT + colOf[m.id]*COL_W; }
function laneTop(track){ return AXIS_H + laneIndex(track)*LANE_H; }
function cardY(m){ return laneTop(m.track) + (LANE_H - CARD_H)/2; }
function cardCenter(m){ return { x: cardX(m)+CARD_W/2, y: cardY(m)+CARD_H/2 }; }
function cardRightMid(m){ return { x: cardX(m)+CARD_W, y: cardY(m)+CARD_H/2 }; }
function cardLeftMid(m){ return { x: cardX(m), y: cardY(m)+CARD_H/2 }; }

const STAGE_W = COL_LEFT + (N_COLS-1)*COL_W + CARD_W + 60;
const STAGE_H = AXIS_H + LANES.length*LANE_H + 8;

/* ===================== 顶栏图例 ===================== */
document.getElementById("legend").innerHTML =
  LANES.map(l=>`<span class="item"><span class="lane-mark" style="background:${l.raw}"></span>${l.name}</span>`).join("");

/* ===================== 舞台尺寸 ===================== */
const stage = document.getElementById("stage");
stage.style.width = STAGE_W+"px";
stage.style.height = STAGE_H+"px";

/* ===================== 泳道色带 + 道名 ===================== */
LANES.forEach((l)=>{
  const band = document.createElement("div");
  band.className = "lane-band";
  band.style.top = laneTop(l.name)+"px";
  band.style.setProperty("--laneglow", hexA(l.raw,0.09));
  band.innerHTML = `<div class="fill"></div>
    <div class="lane-name" style="--lanecolor:${l.raw};--laneshadow:${hexA(l.raw,0.5)}">
      <span class="accent"></span><span class="txt">${l.name}</span>
    </div>`;
  stage.insertBefore(band, stage.firstChild); // 色带落到最底层
});
function hexA(hex,a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

/* ===================== 顶部时间刻度(一列一刻) ===================== */
const timeAxis = document.getElementById("timeAxis");
timeAxis.style.width = STAGE_W+"px";
timeAxis.innerHTML = materials.map(m=>{
  const x = COL_LEFT + colOf[m.id]*COL_W + CARD_W/2;
  return `<div class="tick" style="left:${x}px"><span class="lbl">${fmtTime(m.created_at)}</span><span class="stalk"></span></div>`;
}).join("");

/* ===================== 材料卡片(=节点) ===================== */
const cardsEl = document.getElementById("cards");
cardsEl.style.width = STAGE_W+"px";
cardsEl.innerHTML = materials.map(m=>{
  const c = laneColor(m.track);
  const stCls = m.status==="accepted" ? "st-accepted" : "st-pending";
  const stIc = m.status==="accepted" ? `<span class="ic">${IC.check}</span>` : "";
  const cmtCount = m.comments.length;
  const cmtHtml = cmtCount>0 ? `<span class="cmt">${IC.cmt}${cmtCount}</span>` : "";
  return `<div class="card" data-mid="${m.id}"
      style="left:${cardX(m)}px;top:${cardY(m)}px;--cardaccent:${c}">
      <div class="title">${m.title}</div>
      <div class="meta">
        <span class="badge kind">${KIND_LABEL[m.kind]||m.kind}</span>
        <span class="badge ver">v${m.version}</span>
        <span class="badge ${stCls}">${stIc}${STATUS_LABEL[m.status]||m.status}</span>
      </div>
      <div class="foot">
        <span class="time">${fmtTime(m.created_at)}</span>
        ${cmtHtml}
      </div>
  </div>`;
}).join("");

/* ===================== 流线(SVG) ===================== */
const svg = document.getElementById("flowSvg");
svg.setAttribute("width", STAGE_W);
svg.setAttribute("height", STAGE_H);
svg.setAttribute("viewBox", `0 0 ${STAGE_W} ${STAGE_H}`);

/* 右缘流出 -> 下一卡左缘汇入的圆滑贝塞尔;永远向右(x 递增) */
function flow(a, b, color, cls){
  const dx = Math.max((b.x - a.x)*0.5, 46);
  const c1x = a.x + dx, c2x = b.x - dx;
  const arrow = arrowHead(b, color);
  const glow = (cls==="flow-supersede") ? ` style="--flowglow:${hexA(color,0.55)}"` : "";
  return `<path class="${cls}"${glow} d="M ${a.x} ${a.y} C ${c1x} ${a.y}, ${c2x} ${b.y}, ${b.x} ${b.y}" stroke="${color}"/>${arrow}`;
}
/* 汇入点小三角箭头(指向右) */
function arrowHead(p, color){
  const s = 5;
  return `<path class="flow-tip" style="--tipcolor:${color}" d="M ${p.x} ${p.y} L ${p.x-s*1.7} ${p.y-s} L ${p.x-s*1.7} ${p.y+s} Z"/>`;
}

let flows = "";
materials.forEach(m=>{
  const links = m.links||{};
  // 承袭:上一版右缘 -> 本版左缘(同族沿泳道直行 / 跨泳道曲线汇入)
  (links.supersedes||[]).forEach(srcId=>{
    if(!(srcId in idIndex)) return;
    const src = materials[idIndex[srcId]];
    flows += flow(cardRightMid(src), cardLeftMid(m), laneColor(m.track), "flow-supersede");
  });
  // 相关(parent):派生 —— 本体分出一支到界面图(向右)。always draw from earlier(parent) to later(this)
  if(links.parent && (links.parent in idIndex)){
    const par = materials[idIndex[links.parent]];
    // 保证向右:从时间早的一端流出
    const [a,b] = (cardX(par) <= cardX(m)) ? [cardRightMid(par), cardLeftMid(m)] : [cardRightMid(m), cardLeftMid(par)];
    flows += flow(a, b, "#8790a6", "flow-related");
  }
});
svg.innerHTML = flows;

/* ===================== 决策过程徽章(骑在 v1->v2 承袭流线中点) ===================== */
const decBadge = document.createElement("div");
decBadge.className = "dec-badge";
decBadge.id = "decBadge";
decBadge.innerHTML = `<span class="flag">${IC.flag}</span><span>决策过程</span><span class="n">${DATA.edge_decision_process.decisions.length}</span>`;
stage.appendChild(decBadge);
{
  const e = DATA.edge_decision_process.edge;

    const src = materials[idIndex[e.source]], tgt = materials[idIndex[e.target]];
    const a = cardRightMid(src), b = cardLeftMid(tgt);
    const midX = (a.x+b.x)/2, midY = (a.y+b.y)/2;
    const LEADER = 18;
    decBadge.style.setProperty("--leader", LEADER+"px");
    decBadge.style.left = midX + "px";
    // 徽章底(含引线)落在流线 midY 上:top = midY - LEADER(徽章用 translateY(-100%) 上浮)
    decBadge.style.top  = (midY - LEADER) + "px";
  } else {
    decBadge.style.display = "none";
  }
}

/* ===================== 交互:右滑面板 ===================== */
const scrim = document.getElementById("scrim");
const drawer = document.getElementById("drawer");
const drawerTitle = document.getElementById("drawerTitle");
const drawerTag = document.getElementById("drawerTag");
const drawerBody = document.getElementById("drawerBody");
const domain = document.getElementById("domain");

function closeAll(){
  drawer.classList.remove("open");
  domain.classList.remove("open");
  scrim.classList.remove("on");
  document.querySelectorAll(".card.active").forEach(c=>c.classList.remove("active"));
}
scrim.addEventListener("click", closeAll);
document.getElementById("drawerClose").addEventListener("click", closeAll);
document.getElementById("domainClose").addEventListener("click", ()=>{domain.classList.remove("open"); if(!drawer.classList.contains("open")) scrim.classList.remove("on");});

/* 材料面板 */
function openMaterial(mid){
  const m = DATA.materials.find(x=>x.id===mid);
  if(!m) return;
  document.querySelectorAll(".card.active").forEach(c=>c.classList.remove("active"));
  document.querySelectorAll(`.card[data-mid="${mid}"]`).forEach(c=>c.classList.add("active"));

  drawerTag.textContent = `材料 · ${m.track}`;
  drawerTitle.textContent = m.title;

  const stCls = m.status==="accepted" ? "st-accepted" : "st-pending";
  const stIc = m.status==="accepted" ? `<span class="ic">${IC.check}</span>` : "";
  const c = laneColor(m.track);

  let html = `<div class="field-row">
      <span class="badge kind" style="border-color:${c}55;color:#dde3ee">${KIND_LABEL[m.kind]||m.kind}</span>
      <span class="badge ver">版本 v${m.version}</span>
      <span class="badge ${stCls}">${stIc}${STATUS_LABEL[m.status]||m.status}</span>
      <span class="badge">${fmtTime(m.created_at)}</span>
  </div>`;

  const links = m.links||{};
  if((links.supersedes||[]).length){
    const prev = links.supersedes.map(id=>{
      const pm = DATA.materials.find(x=>x.id===id);
      return pm ? pm.title : id;
    });
    html += `<div class="sec-title">承袭</div>`;
    prev.forEach(t=> html += `<div class="opt"><div class="mk">${IC.caret}</div><div class="otext"><div class="oname">取代上一版 · v${m.version-1}</div><div class="owhy">${t}</div></div></div>`);
  }
  if(links.parent){
    const pm = DATA.materials.find(x=>x.id===links.parent);
    html += `<div class="sec-title">相关</div>`;
    html += `<div class="opt"><div class="mk">${IC.caret}</div><div class="otext"><div class="oname">配套本体</div><div class="owhy">${pm?pm.title:links.parent}</div></div></div>`;
  }

  html += `<div class="sec-title">评论 · ${m.comments.length}</div>`;
  if(m.comments.length){
    html += `<div class="cmt-list">` + m.comments.map(cm=>`
      <div class="cmt-item">
        <div class="ch"><span class="au">${cm.author}</span><span class="ct">${cm.created_at?fmtDay(cm.created_at):""}</span></div>
        <div class="cc">${cm.content}</div>
      </div>`).join("") + `</div>`;
  } else {
    html += `<div class="empty">暂无评论</div>`;
  }

  if(m.live_url){
    html += `<div class="sec-title">打开</div><a class="open-link">${IC.open}打开材料 · ${m.live_url}</a>`;
  }

  drawerBody.innerHTML = html;
  drawer.classList.add("open");
  domain.classList.remove("open");
  scrim.classList.add("on");
}

/* 决策过程面板 */
function openDecisionProcess(){
  const edp = DATA.edge_decision_process;

  drawerTag.textContent = "决策过程 · 承袭连线";
  drawerTitle.textContent = `v1 → v2 之间的裁决(${edp.decisions.length})`;

  let html = `<div class="field-row" style="margin-bottom:6px">
      <span class="badge">v1 评审门</span>
      <span class="badge" style="color:#7c8cf8">承袭</span>
      <span class="badge st-accepted"><span class="ic">${IC.check}</span>v2 完成汇总</span>
  </div>
  <div class="empty" style="margin-bottom:6px">这段承袭不是一个简单动词,而是三条真实裁决累积成的决策过程。</div>`;

  edp.decisions.forEach(d=>{
    html += `<div class="dec-block">
      <div class="dtop">
        <span class="did">${d.id}</span>
        <span class="dstate ${d.status}">${d.status==='proposed'?'提议中':'已采纳'}</span>
      </div>
      <div class="stmt">${d.statement}</div>
      <div class="quote"><span class="qh">理由</span>${d.rationale}</div>
      <div class="opts">
        ${d.decision_space.map(o=>`
          <div class="opt ${o.chosen?'chosen':'rejected'}">
            <div class="mk">${o.chosen?IC.check:IC.cross}</div>
            <div class="otext">
              <div class="oname">${o.option}</div>
              <div class="owhy"><b>${o.chosen?'选择理由':'被否理由'}:</b> ${o.why}</div>
            </div>
          </div>`).join("")}
      </div>
    </div>`;
  });

  drawerBody.innerHTML = html;
  drawer.classList.add("open");
  domain.classList.remove("open");
  scrim.classList.add("on");
}

/* 绑定点击 */
cardsEl.addEventListener("click", e=>{
  const card = e.target.closest(".card");
  if(card) openMaterial(card.dataset.mid);
});
decBadge.addEventListener("click", openDecisionProcess);

/* ===================== 域共同沉淀侧栏 ===================== */
const domainBody = document.getElementById("domainBody");
document.getElementById("domainCount").textContent = DATA.domain_rulings_frontend_design.length;
domainBody.innerHTML = DATA.domain_rulings_frontend_design.map((d,i)=>`
  <div class="dr-item" data-i="${i}">
    <div class="dr-head">
      <span class="dr-id">${d.id.replace('DEC-2026-07-04-','#')}</span>
      <span class="dr-st">${d.statement}</span>
      <span class="caret">${IC.caret}</span>
    </div>
    <div class="dr-detail"><div class="inner">
      <div class="anchor"><b>依据:</b> ${d.rationale}</div>
      <div class="anchor"><b>锚点:</b> ${d.anchor_ref}</div>
      <div class="opts">
        ${d.decision_space.map(o=>`
          <div class="opt ${o.chosen?'chosen':'rejected'}">
            <div class="mk">${o.chosen?IC.check:IC.cross}</div>
            <div class="otext"><div class="oname">${o.option}</div><div class="owhy">${o.why}</div></div>
          </div>`).join("")}
      </div>
    </div></div>
  </div>`).join("");

domainBody.addEventListener("click", e=>{
  const head = e.target.closest(".dr-head");
  if(head) head.parentElement.classList.toggle("exp");
});

document.getElementById("domainToggle").addEventListener("click", ()=>{
  const isOpen = domain.classList.contains("open");
  if(isOpen){ domain.classList.remove("open"); if(!drawer.classList.contains("open")) scrim.classList.remove("on"); }
  else { domain.classList.add("open"); drawer.classList.remove("open"); scrim.classList.add("on"); }
});
</script>
