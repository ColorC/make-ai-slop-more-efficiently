<title>决策轨迹样张 · 类 git 流</title>
<style>
  :root{
    --bg:#0b0e14;
    --panel:rgba(255,255,255,.04);
    --panel-2:rgba(255,255,255,.055);
    --border:rgba(255,255,255,.12);
    --border-soft:rgba(255,255,255,.07);
    --ink:#dde3ee;
    --ink-dim:#9aa3b5;
    --ink-faint:#6b7385;
    --accent:#4c8dff;
    /* 三条轨道冷色系 */
    --rail-a:#59b6c9;   /* 界面一览 青 */
    --rail-b:#7c8cf8;   /* 可玩演示 靛蓝 */
    --rail-c:#4c8dff;   /* 设计评审 亮蓝 */
    --ok:#57c98a;
    --warn:#e0b95a;
    --pending:#9aa3b5;
    --radius:14px;
    --ease:cubic-bezier(.4,.8,.3,1);
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 78% -8%, rgba(76,141,255,.10), transparent 60%),
      radial-gradient(900px 600px at 8% 110%, rgba(124,140,248,.08), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    font-size:13px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;gap:20px;
    padding:12px 22px;
    background:var(--panel);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
    z-index:6;
  }
  .brand{display:flex;flex-direction:column;gap:1px;margin-right:6px;}
  .brand .t{font-size:15px;font-weight:600;letter-spacing:.3px;}
  .brand .s{font-size:12px;color:var(--ink-faint);}
  .seg{display:flex;align-items:center;gap:8px;}
  .seg-label{font-size:12px;color:var(--ink-faint);}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:5px 12px;border-radius:999px;
    background:var(--panel-2);border:1px solid var(--border);
    font-size:12px;color:var(--ink);cursor:default;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .legend{display:flex;align-items:center;gap:16px;margin-left:auto;}
  .legend .item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-dim);}
  .legend .rail-mark{width:14px;height:14px;border-radius:5px;position:relative;}
  .legend .rail-mark::after{content:"";position:absolute;inset:0;border-radius:5px;border:1px solid rgba(255,255,255,.28);}

  /* ---------- 主区 ---------- */
  .main{position:relative;flex:1 1 auto;display:flex;min-height:0;}

  /* 轨迹画布 */
  .canvas-wrap{position:relative;flex:1 1 auto;min-width:0;overflow:auto;}
  .canvas-inner{position:relative;min-height:100%;}

  /* 轨道栏表头 */
  .rail-head{
    position:sticky;top:0;z-index:4;
    display:flex;align-items:stretch;
    background:linear-gradient(180deg, rgba(11,14,20,.97), rgba(11,14,20,.78));
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border-soft);
  }
  .rail-head .gutter-head{
    width:var(--gutter);flex:0 0 auto;position:relative;
    display:flex;align-items:flex-end;
  }
  .rail-head .rtick{
    position:absolute;bottom:12px;transform:translateX(-50%);
  }
  .rail-head .rtick .sw{display:block;width:11px;height:11px;border-radius:3px;box-shadow:0 0 0 3px rgba(255,255,255,.05);}
  .rail-head .gutter-cap{
    position:absolute;bottom:11px;right:12px;
    font-size:12px;color:var(--ink-faint);white-space:nowrap;
  }
  .rail-head .time-col{
    flex:1 1 auto;
    display:flex;align-items:flex-end;
    padding:0 0 11px 8px;font-size:12px;color:var(--ink-faint);
  }

  /* SVG 轨道层 */
  .rails-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:1;}
  .rail-line{fill:none;stroke-width:2.4;stroke-linecap:round;}
  .link-supersede{fill:none;stroke-width:2.6;stroke-linecap:round;}
  .link-parent{fill:none;stroke-width:1.8;stroke-dasharray:1 6;stroke-linecap:round;opacity:.8;}
  .stub{fill:none;stroke-width:1.6;stroke-linecap:round;opacity:.55;}

  /* 行列表 */
  .rows{position:relative;z-index:2;padding:6px 0 60px;}
  .row{
    position:relative;
    display:flex;align-items:center;
    min-height:var(--rowh);
  }
  .gutter{width:var(--gutter);flex:0 0 auto;position:relative;height:100%;}
  /* 轨道点 */
  .node{
    position:absolute;top:50%;transform:translate(-50%,-50%);
    width:16px;height:16px;border-radius:50%;
    background:var(--bg);
    z-index:3;cursor:pointer;
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .node::before{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--nodecolor,var(--accent));box-shadow:0 0 10px -1px var(--nodecolor,var(--accent));}
  .node.hollow::before{inset:3px;background:var(--bg);border:2.5px solid var(--nodecolor,var(--accent));box-shadow:none;}
  .node:hover{transform:translate(-50%,-50%) scale(1.25);}

  /* 材料卡片(紧贴轨道右侧) */
  .card-col{
    flex:1 1 auto;min-width:0;
    display:flex;align-items:center;
    padding:8px 22px 8px 0;
  }
  .card{
    width:100%;
    display:flex;align-items:center;gap:14px;
    padding:11px 15px;
    background:var(--panel);
    border:1px solid var(--border-soft);
    border-left:3px solid var(--cardaccent,var(--accent));
    border-radius:0 11px 11px 0;
    cursor:pointer;
    transition:background .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease);
  }
  .card:hover{background:var(--panel-2);border-color:var(--border);border-left-color:var(--cardaccent);transform:translateX(2px);}
  .card.active{border-color:var(--accent);border-left-color:var(--cardaccent);background:rgba(76,141,255,.09);}
  .card .accent-bar{display:none;}
  .card .body{min-width:0;flex:1 1 auto;}
  .card .title{
    font-size:13px;color:var(--ink);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .meta{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;padding:2px 9px;border-radius:6px;
    border:1px solid var(--border-soft);color:var(--ink-dim);
    background:rgba(255,255,255,.03);
  }
  .badge.kind{color:var(--ink);}
  .badge.ver{font-variant-numeric:tabular-nums;}
  .badge.st-accepted{color:var(--ok);border-color:rgba(87,201,138,.35);background:rgba(87,201,138,.08);}
  .badge.st-pending{color:var(--warn);border-color:rgba(224,185,90,.32);background:rgba(224,185,90,.07);}
  .badge .ic{width:12px;height:12px;display:inline-block;}
  .card .tail{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto;}
  .card .time{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .cmt{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-faint);}
  .cmt svg{opacity:.75;}

  /* 决策过程标记(挂在连线上,像 git tag) */
  .dec-tag{
    position:absolute;z-index:6;
    display:inline-flex;align-items:center;gap:7px;
    padding:6px 11px 6px 9px;border-radius:9px;
    background:linear-gradient(135deg, rgba(38,44,74,.97), rgba(30,35,60,.97));
    border:1px solid rgba(124,140,248,.55);
    color:#cdd8ff;font-size:12px;cursor:pointer;white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,0,0,.5), 0 0 0 4px rgba(11,14,20,.85);
    transition:box-shadow .15s var(--ease), border-color .15s var(--ease);
  }
  .dec-tag::before{
    content:"";position:absolute;left:-16px;top:50%;
    width:16px;height:2px;background:linear-gradient(90deg,rgba(124,140,248,.2),rgba(124,140,248,.85));
    transform:translateY(-50%);
  }
  .dec-tag:hover{border-color:rgba(124,140,248,.85);box-shadow:0 6px 20px rgba(60,90,220,.35);}
  .dec-tag .flag{width:13px;height:13px;color:#7c8cf8;}
  .dec-tag .n{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:17px;height:17px;padding:0 4px;border-radius:6px;
    background:rgba(124,140,248,.28);color:#e6ebff;font-size:12px;font-variant-numeric:tabular-nums;
  }

  /* ---------- 右滑面板 ---------- */
  .scrim{position:absolute;inset:0;background:rgba(4,6,10,.5);opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:8;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .drawer{
    position:absolute;top:0;right:0;height:100%;width:440px;max-width:88vw;
    background:linear-gradient(180deg, rgba(20,24,34,.92), rgba(14,17,25,.94));
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-left:1px solid var(--border);
    transform:translateX(100%);transition:transform .28s var(--ease);
    z-index:9;display:flex;flex-direction:column;
    box-shadow:-24px 0 60px rgba(0,0,0,.5);
  }
  .drawer.open{transform:translateX(0);}
  .drawer .dh{
    display:flex;align-items:flex-start;gap:12px;
    padding:20px 22px 16px;border-bottom:1px solid var(--border-soft);flex:0 0 auto;
  }
  .drawer .dh .dh-tag{font-size:12px;color:var(--ink-faint);letter-spacing:.4px;text-transform:uppercase;}
  .drawer .dh h2{margin:6px 0 0;font-size:15px;font-weight:600;line-height:1.5;color:var(--ink);}
  .drawer .close{
    margin-left:auto;flex:0 0 auto;width:30px;height:30px;border-radius:8px;
    border:1px solid var(--border-soft);background:var(--panel);color:var(--ink-dim);
    cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;
  }
  .drawer .close:hover{background:var(--panel-2);color:var(--ink);}
  .drawer .dbody{overflow:auto;padding:18px 22px 28px;flex:1 1 auto;}

  .field-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .sec-title{font-size:12px;color:var(--ink-faint);letter-spacing:.5px;margin:22px 0 11px;display:flex;align-items:center;gap:8px;}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--border-soft);}

  .cmt-list{display:flex;flex-direction:column;gap:10px;}
  .cmt-item{background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:11px 13px;}
  .cmt-item .ch{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .cmt-item .au{font-size:12px;color:var(--ink);font-weight:500;}
  .cmt-item .ct{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-left:auto;}
  .cmt-item .cc{font-size:13px;color:var(--ink-dim);}
  .empty{font-size:13px;color:var(--ink-faint);padding:8px 0;}

  .open-link{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 15px;border-radius:9px;
    background:rgba(76,141,255,.14);border:1px solid rgba(76,141,255,.4);
    color:#bcd2ff;font-size:13px;cursor:pointer;text-decoration:none;
    transition:background .15s;
  }
  .open-link:hover{background:rgba(76,141,255,.22);}

  /* 决策过程面板 */
  .dec-block{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;
    padding:15px 16px;margin-bottom:14px;position:relative;overflow:hidden;
  }
  .dec-block::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#7c8cf8,#4c8dff);}
  .dec-block .dtop{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .dec-block .did{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .dec-block .dstate{
    margin-left:auto;font-size:12px;padding:2px 9px;border-radius:6px;
    color:var(--ink-dim);border:1px solid var(--border-soft);background:rgba(255,255,255,.03);
  }
  .dec-block .dstate.proposed{color:var(--warn);border-color:rgba(224,185,90,.3);background:rgba(224,185,90,.07);}
  .dec-block .dstate.adopted{color:var(--ok);border-color:rgba(87,201,138,.3);background:rgba(87,201,138,.07);}
  .dec-block .stmt{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:12px;}
  .quote{
    font-size:12px;color:var(--ink-dim);line-height:1.6;
    border-left:2px solid rgba(124,140,248,.5);padding:4px 0 4px 12px;margin:10px 0;
    background:rgba(124,140,248,.05);border-radius:0 6px 6px 0;padding-right:10px;
  }
  .quote .qh{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:3px;}
  .opts{display:flex;flex-direction:column;gap:7px;margin-top:11px;}
  .opt{
    display:flex;gap:9px;align-items:flex-start;
    padding:9px 11px;border-radius:9px;font-size:12px;line-height:1.55;
    border:1px solid var(--border-soft);background:rgba(255,255,255,.02);
  }
  .opt.chosen{border-color:rgba(87,201,138,.35);background:rgba(87,201,138,.06);}
  .opt.rejected{opacity:.9;}
  .opt .mk{flex:0 0 auto;width:16px;height:16px;margin-top:1px;}
  .opt .otext{min-width:0;}
  .opt .oname{color:var(--ink);}
  .opt.chosen .oname{color:#a7e6c2;}
  .opt.rejected .oname{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25);}
  .opt .owhy{color:var(--ink-faint);margin-top:3px;font-size:12px;}
  .opt .owhy b{color:var(--ink-dim);font-weight:500;}

  /* ---------- 域共同沉淀侧栏 ---------- */
  .domain-toggle{
    position:absolute;top:16px;right:18px;z-index:7;
    display:inline-flex;align-items:center;gap:9px;
    padding:8px 14px;border-radius:10px;
    background:var(--panel);border:1px solid var(--border);
    color:var(--ink-dim);font-size:12px;cursor:pointer;
    backdrop-filter:blur(10px);
    transition:background .15s,color .15s,border-color .15s;
  }
  .domain-toggle:hover{background:var(--panel-2);color:var(--ink);border-color:rgba(255,255,255,.2);}
  .domain-toggle .badge-n{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;height:18px;padding:0 5px;border-radius:6px;
    background:rgba(76,141,255,.22);color:#bcd2ff;font-size:12px;
  }
  .domain{
    position:absolute;top:0;right:0;height:100%;width:400px;max-width:86vw;
    background:linear-gradient(180deg, rgba(18,22,32,.94), rgba(13,16,24,.95));
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-left:1px solid var(--border);
    transform:translateX(100%);transition:transform .28s var(--ease);
    z-index:9;display:flex;flex-direction:column;
    box-shadow:-24px 0 60px rgba(0,0,0,.5);
  }
  .domain.open{transform:translateX(0);}
  .domain .dh{padding:20px 20px 15px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;gap:10px;}
  .domain .dh .t{font-size:14px;font-weight:600;color:var(--ink);}
  .domain .dh .s{font-size:12px;color:var(--ink-faint);margin-top:4px;line-height:1.5;}
  .domain .dbody{overflow:auto;padding:14px 18px 26px;flex:1;}
  .dr-item{
    border:1px solid var(--border-soft);border-radius:10px;margin-bottom:10px;
    background:var(--panel);overflow:hidden;
  }
  .dr-head{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;cursor:pointer;transition:background .15s;}
  .dr-head:hover{background:var(--panel-2);}
  .dr-head .dr-id{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;flex:0 0 auto;padding-top:1px;}
  .dr-head .dr-st{font-size:13px;color:var(--ink);line-height:1.5;flex:1;}
  .dr-head .caret{flex:0 0 auto;color:var(--ink-faint);transition:transform .2s var(--ease);margin-top:2px;}
  .dr-item.exp .caret{transform:rotate(90deg);}
  .dr-detail{max-height:0;overflow:hidden;transition:max-height .28s var(--ease);}
  .dr-item.exp .dr-detail{max-height:560px;}
  .dr-detail .inner{padding:2px 13px 14px;border-top:1px solid var(--border-soft);}
  .dr-detail .anchor{font-size:12px;color:var(--ink-faint);margin:10px 0 8px;word-break:break-all;}
  .dr-detail .anchor b{color:var(--ink-dim);font-weight:500;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:6px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);background-clip:content-box;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>

/* ===================== 轨道配置 ===================== */
const RAILS = [
  {name:"界面一览", color:"var(--rail-a)", raw:"#59b6c9"},
  {name:"可玩演示", color:"var(--rail-b)", raw:"#7c8cf8"},
  {name:"设计评审", color:"var(--rail-c)", raw:"#4c8dff"},
];
const railIndex = n => RAILS.findIndex(r=>r.name===n);
const railColor = n => RAILS[railIndex(n)].raw;

const KIND_LABEL = {image:"界面图", demo:"可玩演示", markdown:"评审文档", html:"网页"};
const STATUS_LABEL = {accepted:"已采纳", pending:"待裁决"};

/* 图标 */

  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>',
  cmt:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',

  caret:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
};

/* 时间格式 */
function fmtTime(iso){
  const d = new Date(iso);
  const p = n => String(n).padStart(2,"0");
  return `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDay(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

/* ===================== 布局常量 ===================== */
const LANE_W = 38;         // 每条轨道之间的水平间距
const LANE_LEFT = 40;      // 第一条轨道中心距左
const GUTTER = LANE_LEFT + (RAILS.length-1)*LANE_W + 40; // 轨道区总宽(最后留连接臂空间)
const ROW_H = 92;          // 行高
const HEAD_H = 46;         // 表头高
const TOP_PAD = 6;         // rows 顶内边距

/* 排序:时间从新到旧(顶部最新,像 git log) */
const materials = [...DATA.materials].sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
const idIndex = {};
materials.forEach((m,i)=> idIndex[m.id]=i);

/* 轨道中心 x */
function laneX(rail){ return LANE_LEFT + railIndex(rail)*LANE_W; }
/* 行中心 y */
function rowY(i){ return HEAD_H + TOP_PAD + i*ROW_H + ROW_H/2; }

/* ===================== 渲染顶栏图例 ===================== */
const legend = document.getElementById("legend");
legend.innerHTML = RAILS.map(r=>`<span class="item"><span class="rail-mark" style="background:${r.raw}"></span>${r.name}</span>`).join("");

/* ===================== 渲染轨道表头 ===================== */
document.documentElement.style.setProperty("--rowh", ROW_H+"px");
document.documentElement.style.setProperty("--gutter", GUTTER+"px");

const railHead = document.getElementById("railHead");
railHead.innerHTML = `<div class="gutter-head">`
  + RAILS.map(r=>`<div class="rtick" style="left:${laneX(r.name)}px" title="${r.name}"><span class="sw" style="background:${r.raw}"></span></div>`).join("")
  + `</div><div class="time-col"><span style="color:var(--ink-dim)">产物轨道</span><span style="margin:0 8px;opacity:.4">·</span>材料版本按时间(新→旧)</div>`;

/* ===================== 渲染行 ===================== */
const rowsEl = document.getElementById("rows");
rowsEl.innerHTML = materials.map((m,i)=>{
  const c = railColor(m.track);
  const x = laneX(m.track);

  const node = `<div class="node ${m.status==='pending'?'hollow':''}" data-mid="${m.id}" style="left:${x}px;--nodecolor:${c}"></div>`;

  const stCls = m.status==="accepted" ? "st-accepted" : "st-pending";
  const stIc = m.status==="accepted" ? IC.check : "";
  const cmtCount = m.comments.length;
  const cmtHtml = cmtCount>0 ? `<span class="cmt">${IC.cmt}${cmtCount}</span>` : "";

  const card = `<div class="card-col"><div class="card" data-mid="${m.id}" style="--cardaccent:${c}">
      <div class="body">
        <div class="title">${m.title}</div>
        <div class="meta">
          <span class="badge kind">${KIND_LABEL[m.kind]||m.kind}</span>
          <span class="badge ver">v${m.version}</span>
          <span class="badge ${stCls}">${stIc?`<span class="ic">${stIc}</span>`:""}${STATUS_LABEL[m.status]||m.status}</span>
        </div>
      </div>
      <div class="tail">
        <span class="time">${fmtTime(m.created_at)}</span>
        ${cmtHtml}
      </div>
  </div></div>`;

  return `<div class="row" data-mid="${m.id}"><div class="gutter">${node}</div>${card}</div>`;
}).join("");

/* ===================== 渲染轨道连线(SVG) ===================== */
const svg = document.getElementById("railsSvg");
const totalH = HEAD_H + TOP_PAD + materials.length*ROW_H + 60;
const canvasInner = document.getElementById("canvasInner");
canvasInner.style.minHeight = totalH+"px";

function measureWidth(){
  return document.getElementById("canvasWrap").clientWidth;
}

/* 平滑竖直轨道线段 + 关系曲线 + 节点到卡片的连接臂 */
function buildRails(){
  const W = Math.max(measureWidth(), GUTTER + 520);
  svg.setAttribute("width", W);
  svg.setAttribute("height", totalH);
  svg.setAttribute("viewBox", `0 0 ${W} ${totalH}`);

  let paths = "";

  // 1) 每条轨道的竖直脊线(本轨道最早到最晚材料)
  RAILS.forEach(r=>{
    const idxs = materials.map((m,i)=> m.track===r.name ? i : -1).filter(i=>i>=0);
    if(idxs.length===0) return;
    const x = laneX(r.name);
    const y1 = rowY(idxs[0]);
    const y2 = rowY(idxs[idxs.length-1]);
    paths += `<path class="rail-line" d="M ${x} ${y1} L ${x} ${y2}" stroke="${r.raw}" opacity="0.32"/>`;
  });

  // 2) 节点到卡片左缘的连接臂(短平线,让"这个提交=这份材料"可读)
  materials.forEach((m,i)=>{
    const x = laneX(m.track), y = rowY(i);
    paths += `<path class="stub" d="M ${x} ${y} L ${GUTTER} ${y}" stroke="${railColor(m.track)}"/>`;
  });

  // 3) 关系连线:承袭(supersedes)=实线跨轨圆滑;相关(parent)=虚线
  materials.forEach((m,i)=>{
    const links = m.links||{};
    (links.supersedes||[]).forEach(srcId=>{
      if(!(srcId in idIndex)) return;
      const j = idIndex[srcId];
      const xa = laneX(materials[j].track), ya = rowY(j);
      const xb = laneX(m.track), yb = rowY(i);
      paths += curve(xa,ya,xb,yb, railColor(m.track), "link-supersede");
    });
    if(links.parent && (links.parent in idIndex)){
      const j = idIndex[links.parent];
      const xa = laneX(materials[j].track), ya = rowY(j);
      const xb = laneX(m.track), yb = rowY(i);
      paths += curve(xb,yb,xa,ya, "#8790a6", "link-parent");
    }
  });

  svg.innerHTML = paths;
  placeDecTag();
}

/* 圆滑贝塞尔:同轨=直线;跨轨=S 形轨道跳转(git graph 风) */
function curve(x1,y1,x2,y2,color,cls){
  let d;
  if(Math.abs(x1-x2) < 0.5){
    d = `M ${x1} ${y1} L ${x2} ${y2}`;
  } else {
    const dy = (y2-y1);
    const c1y = y1 + dy*0.5;
    const c2y = y2 - dy*0.5;
    d = `M ${x1} ${y1} C ${x1} ${c1y}, ${x2} ${c2y}, ${x2} ${y2}`;
  }
  return `<path class="${cls}" d="${d}" stroke="${color}"/>`;
}

/* ===================== 决策过程标记(挂在 v1->v2 supersedes 连线上) ===================== */
const decTag = document.createElement("div");
decTag.className = "dec-tag";
decTag.id = "decTag";
decTag.innerHTML = `${IC.flag ? `<span class="flag">${IC.flag}</span>`:""}<span>决策过程</span><span class="n">${DATA.edge_decision_process.decisions.length}</span>`;
document.getElementById("canvasInner").appendChild(decTag);

function placeDecTag(){
  const e = DATA.edge_decision_process.edge;
  if(!(e.source in idIndex) || !(e.target in idIndex)){ decTag.style.display="none"; return; }
  const i = idIndex[e.source], j = idIndex[e.target];
  const x1 = laneX(materials[i].track), y1 = rowY(i);
  const x2 = laneX(materials[j].track), y2 = rowY(j);
  const spineX = (x1 + x2)/2;   // 同轨时即轨道线 x
  const my = (y1 + y2)/2 - 8;    // 承袭连线中点,略上移落进两卡之间的暗带
  // 徽章挂在轨道线右侧,在轨道区内,像 git tag 从提交点引出(leader 由 CSS ::before 画)
  decTag.style.left = (spineX + 16) + "px";
  decTag.style.top = my + "px";
  decTag.style.transform = "translateY(-50%)";
}

/* ===================== 交互:右滑面板 ===================== */
const scrim = document.getElementById("scrim");
const drawer = document.getElementById("drawer");
const drawerTitle = document.getElementById("drawerTitle");
const drawerTag = document.getElementById("drawerTag");
const drawerBody = document.getElementById("drawerBody");
const domain = document.getElementById("domain");

function closeAll(){
  drawer.classList.remove("open");
  domain.classList.remove("open");
  scrim.classList.remove("on");
  document.querySelectorAll(".card.active").forEach(c=>c.classList.remove("active"));
}
scrim.addEventListener("click", closeAll);
document.getElementById("drawerClose").addEventListener("click", closeAll);
document.getElementById("domainClose").addEventListener("click", ()=>{domain.classList.remove("open"); if(!drawer.classList.contains("open")) scrim.classList.remove("on");});

/* 材料面板 */
function openMaterial(mid){
  const m = DATA.materials.find(x=>x.id===mid);
  if(!m) return;
  document.querySelectorAll(".card.active").forEach(c=>c.classList.remove("active"));
  document.querySelectorAll(`.card[data-mid="${mid}"]`).forEach(c=>c.classList.add("active"));

  drawerTag.textContent = `材料 · ${m.track}`;
  drawerTitle.textContent = m.title;

  const stCls = m.status==="accepted" ? "st-accepted" : "st-pending";
  const stIc = m.status==="accepted" ? `<span class="ic">${IC.check}</span>` : "";
  const c = railColor(m.track);

  let html = `<div class="field-row">
      <span class="badge kind" style="border-color:${c}55;color:#dde3ee">${KIND_LABEL[m.kind]||m.kind}</span>
      <span class="badge ver">版本 v${m.version}</span>
      <span class="badge ${stCls}">${stIc}${STATUS_LABEL[m.status]||m.status}</span>
      <span class="badge">${fmtTime(m.created_at)}</span>
  </div>`;

  // 承袭关系
  const links = m.links||{};
  if((links.supersedes||[]).length){
    const prev = links.supersedes.map(id=>{
      const pm = DATA.materials.find(x=>x.id===id);
      return pm ? pm.title : id;
    });
    html += `<div class="sec-title">承袭</div>`;
    prev.forEach(t=> html += `<div class="opt"><div class="mk">${IC.caret}</div><div class="otext"><div class="oname">取代上一版 · v${m.version-1}</div><div class="owhy">${t}</div></div></div>`);
  }
  if(links.parent){
    const pm = DATA.materials.find(x=>x.id===links.parent);
    html += `<div class="sec-title">相关</div>`;
    html += `<div class="opt"><div class="mk">${IC.caret}</div><div class="otext"><div class="oname">配套本体</div><div class="owhy">${pm?pm.title:links.parent}</div></div></div>`;
  }

  // 评论
  html += `<div class="sec-title">评论 · ${m.comments.length}</div>`;
  if(m.comments.length){
    html += `<div class="cmt-list">` + m.comments.map(cm=>`
      <div class="cmt-item">
        <div class="ch"><span class="au">${cm.author}</span><span class="ct">${cm.created_at?fmtDay(cm.created_at):""}</span></div>
        <div class="cc">${cm.content}</div>
      </div>`).join("") + `</div>`;
  } else {
    html += `<div class="empty">暂无评论</div>`;
  }

  // 打开链接
  if(m.live_url){
    html += `<div class="sec-title">打开</div><a class="open-link">${IC.open}打开材料 · ${m.live_url}</a>`;
  }

  drawerBody.innerHTML = html;
  drawer.classList.add("open");
  domain.classList.remove("open");
  scrim.classList.add("on");
}

/* 决策过程面板 */
function openDecisionProcess(){
  const edp = DATA.edge_decision_process;
  const src = DATA.materials.find(x=>x.id===edp.edge.source);
  const tgt = DATA.materials.find(x=>x.id===edp.edge.target);

  drawerTag.textContent = "决策过程 · 承袭连线";
  drawerTitle.textContent = `v1 → v2 之间的裁决(${edp.decisions.length})`;

  let html = `<div class="field-row" style="margin-bottom:6px">
      <span class="badge">v1 评审门</span>
      <span class="badge" style="color:#7c8cf8">${IC.caret ? '':''}承袭</span>
      <span class="badge st-accepted"><span class="ic">${IC.check}</span>v2 完成汇总</span>
  </div>
  <div class="empty" style="margin-bottom:6px">这段承袭不是一个简单动词,而是三条真实裁决累积成的决策过程。</div>`;

  edp.decisions.forEach(d=>{
    html += `<div class="dec-block">
      <div class="dtop">
        <span class="did">${d.id}</span>
        <span class="dstate ${d.status}">${d.status==='proposed'?'提议中':'已采纳'}</span>
      </div>
      <div class="stmt">${d.statement}</div>
      <div class="quote"><span class="qh">理由</span>${d.rationale}</div>
      <div class="opts">
        ${d.decision_space.map(o=>`
          <div class="opt ${o.chosen?'chosen':'rejected'}">
            <div class="mk">${o.chosen?IC.check:IC.cross}</div>
            <div class="otext">
              <div class="oname">${o.option}</div>
              <div class="owhy"><b>${o.chosen?'选择理由':'被否理由'}:</b> ${o.why}</div>
            </div>
          </div>`).join("")}
      </div>
    </div>`;
  });

  drawerBody.innerHTML = html;
  drawer.classList.add("open");
  domain.classList.remove("open");
  scrim.classList.add("on");
}

/* 绑定点击 */
rowsEl.addEventListener("click", e=>{
  const card = e.target.closest(".card");
  const node = e.target.closest(".node");
  if(card) openMaterial(card.dataset.mid);
  else if(node) openMaterial(node.dataset.mid);
});
decTag.addEventListener("click", openDecisionProcess);
