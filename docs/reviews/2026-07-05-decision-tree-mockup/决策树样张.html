<title>前端设计域 · 决策树样张</title>
<style>
  :root{
    --bg:#0b0e14;
    --panel:rgba(255,255,255,.04);
    --panel-2:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.12);
    --border-soft:rgba(255,255,255,.07);
    --ink:#dde3ee;
    --ink-dim:#9aa3b5;
    --ink-faint:#6b7385;
    --accent:#4c8dff;
    /* 四步冷色系:与轨迹样张v2同族(青→靛→亮蓝),第四步收束到亮蓝 */
    --s1:#59b6c9;   /* 信息审计 青 */
    --s2:#6ea3e0;   /* 交互审计 青蓝 */
    --s3:#7c8cf8;   /* 设计稿 靛蓝 */
    --s4:#4c8dff;   /* 实际稿 亮蓝 */
    --ok:#57c98a;
    --warn:#e0b95a;
    --pending:#9aa3b5;
    --gate:#c9a8ff;   /* 门禁紫 */
    --ease:cubic-bezier(.4,.8,.3,1);
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 80% -8%, rgba(76,141,255,.10), transparent 60%),
      radial-gradient(900px 600px at 6% 112%, rgba(124,140,248,.08), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    font-size:13px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:flex-start;gap:22px;
    padding:14px 24px 13px;
    background:var(--panel);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
    z-index:6;
  }
  .brand{display:flex;flex-direction:column;gap:3px;}
  .brand .t{font-size:18px;font-weight:600;letter-spacing:.4px;}
  .brand .s{font-size:13px;color:var(--ink-dim);}
  .brand .doc-note{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .brand .doc-note b{color:var(--s3);font-weight:500;}

  .entry-tags{display:flex;flex-direction:column;gap:6px;margin-left:auto;align-items:flex-end;}
  .entry-tags .eh{font-size:12px;color:var(--ink-faint);letter-spacing:.3px;}
  .entry-tag{
    display:inline-flex;align-items:center;gap:7px;
    padding:5px 11px;border-radius:8px;
    background:var(--panel-2);border:1px solid var(--border-soft);
    font-size:12px;color:var(--ink-dim);white-space:nowrap;
  }
  .entry-tag .k{color:var(--ink-faint);}
  .entry-tag .v{color:var(--ink);}
  .entry-tag svg{width:13px;height:13px;color:var(--accent);opacity:.85;}

  /* ---------- 主区 ---------- */
  .main{position:relative;flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}

  .stage-wrap{
    position:relative;flex:1 1 auto;min-height:0;overflow:auto;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:20px 30px 18px;
  }
  .stage-inner{margin:0 auto;min-width:min-content;}
  /* 管线导言条:填补上部留白,并明说这是一条单程管线 */
  .flow-hint{
    display:flex;align-items:center;gap:12px;
    margin:0 0 20px 4px;
  }
  .flow-hint .rail-cap{
    width:34px;height:34px;border-radius:10px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, rgba(89,182,201,.18), rgba(76,141,255,.18));
    border:1px solid rgba(110,163,224,.3);
  }
  .flow-hint .rail-cap svg{width:18px;height:18px;color:#8fb8e6;}
  .flow-hint .fh-tt .l{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.3px;}
  .flow-hint .fh-tt .s{font-size:12px;color:var(--ink-faint);margin-top:1px;}
  .flow-hint .fh-tt .s b{color:var(--ink-dim);font-weight:500;}
  .stage{
    position:relative;
    display:flex;align-items:stretch;gap:0;
    min-width:min-content;
    padding:12px 0;
  }
  /* 卡片背后一条贯穿的管线脊骨(强化"一条管线"读感) */
  .stage::before{
    content:"";position:absolute;left:20px;right:20px;top:50%;height:2px;
    transform:translateY(-1px);
    background:linear-gradient(90deg, rgba(89,182,201,.28), rgba(110,163,224,.28), rgba(124,140,248,.28), rgba(76,141,255,.28));
    z-index:0;
  }
  .stage .step, .stage .arrow{position:relative;z-index:1;}

  /* ---------- 步骤卡 ---------- */
  .step{
    position:relative;
    width:290px;flex:0 0 290px;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg, rgba(24,29,40,.94), rgba(16,20,29,.94));
    border:1px solid var(--border-soft);
    border-top:3px solid var(--stepc,var(--accent));
    border-radius:13px;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.38);
    transition:border-color .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
    overflow:hidden;
  }
  .step:hover{
    border-color:var(--border);border-top-color:var(--stepc);
    transform:translateY(-3px);
    box-shadow:0 16px 40px rgba(0,0,0,.5);
  }
  .step.active{
    border-color:var(--stepc);border-top-color:var(--stepc);
    box-shadow:0 16px 42px rgba(0,0,0,.55), 0 0 0 1px var(--stepc);
  }
  .step .shead{
    display:flex;align-items:center;gap:11px;
    padding:15px 16px 12px;
  }
  .step .seq{
    flex:0 0 auto;
    width:30px;height:30px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
    color:#0b0e14;
    background:var(--stepc);
    box-shadow:0 0 14px var(--stepglow);
  }
  .step .lname{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.5px;}
  .step .sbody{padding:0 16px 15px;display:flex;flex-direction:column;gap:12px;flex:1 1 auto;}

  .plain{
    font-size:13px;color:var(--ink-dim);line-height:1.6;
    min-height:60px;
  }

  /* 门禁行 */
  .gate-row{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;border-radius:9px;
    background:rgba(201,168,255,.06);
    border:1px solid rgba(201,168,255,.22);
  }
  .gate-row .shield{flex:0 0 auto;width:16px;height:16px;color:var(--gate);}
  .gate-row .gtxt{font-size:12px;color:#d8c7ff;line-height:1.45;font-variant-numeric:tabular-nums;word-break:break-all;}

  /* 参考来源计数 */
  .ref-counts{display:flex;gap:8px;}
  .ref-chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:8px;flex:1;
    background:rgba(255,255,255,.03);border:1px solid var(--border-soft);
  }
  .ref-chip .ic{width:13px;height:13px;color:var(--ink-faint);flex:0 0 auto;}
  .ref-chip .rl{font-size:12px;color:var(--ink-faint);}
  .ref-chip .rn{
    margin-left:auto;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  .ref-chip.zero .rn{color:var(--ink-faint);}
  .ref-chip.zero{border-style:dashed;}

  /* 产出去向 */
  .sink{
    display:flex;align-items:center;gap:7px;
    font-size:12px;color:var(--ink-faint);
    margin-top:auto;padding-top:2px;
  }
  .sink .lane-dot{width:9px;height:9px;border-radius:50%;background:var(--stepc);box-shadow:0 0 8px var(--stepc);flex:0 0 auto;}
  .sink b{color:var(--ink-dim);font-weight:500;}

  .step .sfoot{
    padding:10px 16px;border-top:1px solid var(--border-soft);
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--stepc);
    background:rgba(255,255,255,.015);
  }
  .step .sfoot svg{width:13px;height:13px;}

  /* 步骤间粗箭头 */
  .arrow{
    flex:0 0 46px;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .arrow svg{width:46px;height:26px;overflow:visible;}

  /* ---------- 底部窄带 ---------- */
  .footbar{
    flex:0 0 auto;
    display:flex;align-items:center;gap:12px;
    padding:11px 24px;
    background:var(--panel);
    border-top:1px solid var(--border);
    font-size:12px;color:var(--ink-dim);
    z-index:5;
  }
  .footbar .grow{
    display:inline-flex;align-items:center;gap:8px;color:var(--ink-faint);
  }
  .footbar .grow svg{width:14px;height:14px;color:var(--s3);}
  .footbar .foot-inst-grp{
    display:inline-flex;align-items:center;gap:9px;margin-left:auto;
  }
  .footbar .foot-inst-label{font-size:12px;color:var(--ink-faint);}
  .footbar .inst{
    display:inline-flex;align-items:center;gap:8px;
    padding:4px 11px;border-radius:8px;
    background:rgba(76,141,255,.1);border:1px solid rgba(76,141,255,.28);
    color:#bcd2ff;
  }
  .footbar .inst .pdot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
  .footbar .inst b{color:#dbe6ff;font-weight:600;}

  /* ---------- 遮罩 & 右滑面板 ---------- */
  .scrim{position:absolute;inset:0;background:rgba(4,6,10,.5);opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:8;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .drawer{
    position:absolute;top:0;right:0;height:100%;width:470px;max-width:90vw;
    background:linear-gradient(180deg, rgba(20,24,34,.94), rgba(13,16,24,.96));
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-left:1px solid var(--border);
    transform:translateX(100%);transition:transform .28s var(--ease);
    z-index:9;display:flex;flex-direction:column;
    box-shadow:-24px 0 60px rgba(0,0,0,.5);
  }
  .drawer.open{transform:translateX(0);}
  .drawer .dh{
    display:flex;align-items:flex-start;gap:12px;
    padding:19px 22px 15px;border-bottom:1px solid var(--border-soft);flex:0 0 auto;
  }
  .drawer .dh .dh-seq{
    flex:0 0 auto;width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:600;color:#0b0e14;
    background:var(--drawerc,var(--accent));box-shadow:0 0 16px var(--drawerc,var(--accent));
  }
  .drawer .dh .dh-tt{flex:1;min-width:0;}
  .drawer .dh .dh-tag{font-size:12px;color:var(--ink-faint);letter-spacing:.4px;}
  .drawer .dh h2{margin:3px 0 0;font-size:16px;font-weight:600;line-height:1.4;color:var(--ink);}
  .drawer .close{
    margin-left:auto;flex:0 0 auto;width:30px;height:30px;border-radius:8px;
    border:1px solid var(--border-soft);background:var(--panel);color:var(--ink-dim);
    cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;
  }
  .drawer .close:hover{background:var(--panel-2);color:var(--ink);}
  .drawer .dbody{overflow:auto;padding:16px 22px 22px;flex:1 1 auto;}
  .drawer .dfoot{
    flex:0 0 auto;padding:14px 22px;border-top:1px solid var(--border-soft);
    background:rgba(255,255,255,.015);
  }

  .sec-title{
    font-size:12px;color:var(--ink-faint);letter-spacing:.5px;
    margin:20px 0 11px;display:flex;align-items:center;gap:9px;
  }
  .sec-title:first-child{margin-top:2px;}
  .sec-title .st-n{
    font-variant-numeric:tabular-nums;color:var(--ink-dim);
    background:var(--panel-2);border:1px solid var(--border-soft);
    border-radius:6px;padding:0 7px;height:17px;display:inline-flex;align-items:center;
  }
  .sec-title::after{content:"";flex:1;height:1px;background:var(--border-soft);}

  .plain-lead{font-size:13px;color:var(--ink-dim);line-height:1.65;margin-bottom:4px;}

  /* 上一轮样例条目 */
  .samp{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:11px;
    padding:12px 14px;margin-bottom:10px;position:relative;overflow:hidden;
  }
  .samp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--drawerc,var(--accent));}
  .samp .stitle{font-size:13px;color:var(--ink);line-height:1.5;margin-bottom:8px;}
  .samp .smeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:12px;padding:1px 8px;border-radius:6px;
    border:1px solid var(--border-soft);color:var(--ink-dim);
    background:rgba(255,255,255,.03);white-space:nowrap;
  }
  .badge.kind{color:var(--ink);}
  .badge.ver{font-variant-numeric:tabular-nums;}
  .badge.st-accepted{color:var(--ok);border-color:rgba(87,201,138,.35);background:rgba(87,201,138,.08);}
  .badge.st-pending{color:var(--warn);border-color:rgba(224,185,90,.32);background:rgba(224,185,90,.07);}
  .badge.mid{color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .badge .ic{width:12px;height:12px;display:inline-block;}
  .samp .companion{font-size:12px;color:var(--ink-faint);margin-top:7px;display:flex;align-items:center;gap:6px;}
  .samp .companion svg{width:12px;height:12px;}

  .empty-samp{
    font-size:12px;color:var(--ink-faint);line-height:1.6;
    padding:13px 14px;border:1px dashed var(--border-soft);border-radius:11px;
    background:rgba(255,255,255,.015);
    display:flex;gap:10px;align-items:flex-start;
  }
  .empty-samp svg{width:16px;height:16px;color:var(--ink-faint);flex:0 0 auto;margin-top:1px;opacity:.7;}

  /* 适用裁决条目 */
  .rul{
    border:1px solid var(--border-soft);border-radius:10px;margin-bottom:9px;
    background:var(--panel);overflow:hidden;
  }
  .rul-head{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;cursor:pointer;transition:background .15s;}
  .rul-head:hover{background:var(--panel-2);}
  .rul-head .rid{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;flex:0 0 auto;padding-top:1px;}
  .rul-head .rst{font-size:13px;color:var(--ink);line-height:1.5;flex:1;}
  .rul-head .caret{flex:0 0 auto;color:var(--ink-faint);transition:transform .2s var(--ease);margin-top:2px;}
  .rul.exp .caret{transform:rotate(90deg);}
  .rul-detail{max-height:0;overflow:hidden;transition:max-height .3s var(--ease);}
  .rul.exp .rul-detail{max-height:420px;}
  .rul-detail .inner{padding:3px 13px 13px;border-top:1px solid var(--border-soft);}
  .quote{
    font-size:12px;color:var(--ink-dim);line-height:1.6;
    border-left:2px solid rgba(124,140,248,.5);padding:5px 10px 5px 12px;margin:10px 0 6px;
    background:rgba(124,140,248,.05);border-radius:0 6px 6px 0;
  }
  .quote .qh{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:3px;}
  .rul-detail .enf{font-size:12px;color:var(--ink-faint);margin-top:8px;line-height:1.55;word-break:break-all;}
  .rul-detail .enf b{color:var(--gate);font-weight:500;}

  /* 门禁块 */
  .gate-block{
    background:rgba(201,168,255,.05);border:1px solid rgba(201,168,255,.22);border-radius:11px;
    padding:13px 15px;
  }
  .gate-block .gb-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
  .gate-block .gb-top svg{width:17px;height:17px;color:var(--gate);}
  .gate-block .gb-top .gb-name{font-size:13px;color:#d8c7ff;font-weight:500;font-variant-numeric:tabular-nums;word-break:break-all;}
  .gate-block .gb-desc{font-size:12px;color:var(--ink-dim);line-height:1.6;}

  /* 按这一步开工 */
  .start-btn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    padding:12px 16px;border-radius:11px;
    background:linear-gradient(135deg, rgba(76,141,255,.9), rgba(96,120,240,.9));
    border:1px solid rgba(124,140,248,.6);
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;
    box-shadow:0 6px 20px rgba(50,80,220,.35);
    transition:filter .15s, transform .1s;
  }
  .start-btn:hover{filter:brightness(1.08);}
  .start-btn:active{transform:translateY(1px);}
  .start-btn svg{width:16px;height:16px;}

  /* ---------- 开工上下文包预览(居中模态) ---------- */
  .modal-scrim{
    position:absolute;inset:0;background:rgba(4,6,10,.68);z-index:20;
    display:flex;align-items:center;justify-content:center;padding:34px;
    opacity:0;pointer-events:none;transition:opacity .2s var(--ease);
  }
  .modal-scrim.on{opacity:1;pointer-events:auto;}
  .pkg{
    width:560px;max-width:94vw;max-height:88vh;
    background:linear-gradient(180deg, rgba(22,26,37,.98), rgba(15,18,27,.99));
    border:1px solid var(--border);border-radius:16px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    display:flex;flex-direction:column;overflow:hidden;
    transform:scale(.96);transition:transform .22s var(--ease);
  }
  .modal-scrim.on .pkg{transform:scale(1);}
  .pkg .ph{
    display:flex;align-items:flex-start;gap:13px;
    padding:18px 22px 15px;border-bottom:1px solid var(--border-soft);
  }
  .pkg .ph .ph-ic{
    flex:0 0 auto;width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(76,141,255,.16);border:1px solid rgba(76,141,255,.4);
  }
  .pkg .ph .ph-ic svg{width:19px;height:19px;color:#bcd2ff;}
  .pkg .ph .ph-tt{flex:1;min-width:0;}
  .pkg .ph .ph-tag{font-size:12px;color:var(--ink-faint);letter-spacing:.3px;}
  .pkg .ph h3{margin:3px 0 0;font-size:15px;font-weight:600;color:var(--ink);line-height:1.4;}
  .pkg .ph .close{
    margin-left:auto;flex:0 0 auto;width:30px;height:30px;border-radius:8px;
    border:1px solid var(--border-soft);background:var(--panel);color:var(--ink-dim);
    cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .pkg .ph .close:hover{background:var(--panel-2);color:var(--ink);}

  .pkg .pbody{overflow:auto;padding:6px 0;flex:1 1 auto;}
  .pkg-row{
    padding:13px 22px;border-bottom:1px solid var(--border-soft);
  }
  .pkg-row:last-child{border-bottom:none;}
  .pkg-row .pk-label{
    font-size:12px;color:var(--ink-faint);letter-spacing:.4px;
    display:flex;align-items:center;gap:7px;margin-bottom:7px;
  }
  .pkg-row .pk-label svg{width:13px;height:13px;color:var(--accent);opacity:.85;}
  .pkg-row .pk-val{font-size:13px;color:var(--ink-dim);line-height:1.6;}
  .pkg-row .pk-val .proj-chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:4px 11px;border-radius:8px;
    background:var(--panel-2);border:1px solid var(--border);color:var(--ink);
  }
  .pkg-row .pk-val .proj-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .pkg-item{
    display:flex;align-items:flex-start;gap:8px;
    font-size:12px;color:var(--ink-dim);line-height:1.55;margin-bottom:5px;
  }
  .pkg-item:last-child{margin-bottom:0;}
  .pkg-item .pi-mk{flex:0 0 auto;color:var(--ink-faint);font-variant-numeric:tabular-nums;padding-top:1px;}
  .pkg-item.rul-ref .pi-mk{color:var(--s3);}
  .pkg-item.gate-ref .pi-mk{color:var(--gate);}
  .pkg-item .pi-tx b{color:var(--ink);font-weight:500;}
  .pkg-empty{font-size:12px;color:var(--ink-faint);font-style:normal;}

  .pkg .pfoot{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:14px 22px;border-top:1px solid var(--border-soft);
    background:rgba(255,255,255,.015);
  }
  .pkg .pfoot .hint{font-size:12px;color:var(--ink-faint);}
  .copy-btn{
    margin-left:auto;
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:10px;
    background:rgba(76,141,255,.16);border:1px solid rgba(76,141,255,.42);
    color:#bcd2ff;font-size:13px;font-weight:500;cursor:pointer;
    transition:background .15s;
  }
  .copy-btn:hover{background:rgba(76,141,255,.26);}

  const stCls = m.status==="accepted" ? "st-accepted" : "st-pending";
  const stIc = m.status==="accepted" ? `<span class="ic">${IC.check}</span>` : "";
  const comp = isCompanion ? `<div class="companion">${IC.link}评审伴生材料 · 评的是上面的实际稿</div>` : "";
  return `<div class="samp" style="--drawerc:${STEP_COLOR}">
    <div class="stitle">${m.title}</div>
    <div class="smeta">
      <span class="badge kind">${KIND_LABEL[m.kind]||m.kind}</span>
      <span class="badge ver">v${m.version}</span>
      <span class="badge ${stCls}">${stIc}${STATUS_LABEL[m.status]||m.status}</span>
      <span class="badge mid">${m.id.replace('mat_','mat·').slice(0,10)}</span>
    </div>
    ${comp}
  </div>`;
}

let STEP_COLOR = "var(--accent)";

function openStep(seq){
  const s = STEPS.find(x=>x.seq===seq);
  if(!s) return;
  currentStep = s;
  STEP_COLOR = s.color;

  document.querySelectorAll(".step.active").forEach(c=>c.classList.remove("active"));
  document.querySelector(`.step[data-seq="${seq}"]`)?.classList.add("active");

  drawer.style.setProperty("--drawerc", s.color);
  drawerSeq.style.setProperty("--drawerc", s.color);
  drawerSeq.textContent = s.seq;
  drawerTag.textContent = `第 ${s.seq} 步 · 前端设计域`;
  drawerTitle.textContent = s.name;

  let h = `<div class="plain-lead">${s.plain}</div>`;

  /* 上一轮样例 */
  h += `<div class="sec-title">上一轮的样例<span class="st-n">${s.sampleIds.length}</span></div>`;
  if(s.sampleIds.length){
    s.sampleIds.forEach(id=> h += sampleCard(id, false));
    if(s.companionIds && s.companionIds.length){
      s.companionIds.forEach(id=> h += sampleCard(id, true));
    }
  } else {
    h += `<div class="empty-samp">${IC.info}<span>本域该层还没有材料样例,首轮产出后会自动出现在这里。</span></div>`;
  }

  /* 适用裁决 */
  h += `<div class="sec-title">适用裁决<span class="st-n">${s.rulingIds.length}</span></div>`;
  if(s.rulingIds.length){
    s.rulingIds.forEach(id=>{
      const r = RULE(id); if(!r) return;
      h += `<div class="rul" data-rid="${id}">
        <div class="rul-head">
          <span class="rid">${shortId(id)}</span>
          <span class="rst">${r.statement}</span>
          <span class="caret">${IC.caret}</span>
        </div>
        <div class="rul-detail"><div class="inner">
          <div class="quote"><span class="qh">原话引文</span>${r.excerpt}</div>
          <div class="enf"><b>执法器:</b>${r.enforced_by.join(" · ")}</div>
        </div></div>
      </div>`;
    });
  } else {
    h += `<div class="empty-samp">${IC.info}<span>本步暂无专属裁决;上游各步的裁决在实装期同样适用。</span></div>`;
  }

  /* 门禁 */
  h += `<div class="sec-title">门禁</div>`;
  h += `<div class="gate-block">
    <div class="gb-top">${IC.shield}<span class="gb-name">${s.gate}</span></div>
    <div class="gb-desc">${s.gate_desc}</div>
  </div>`;

  drawerBody.innerHTML = h;
  drawer.classList.add("open");
  scrim.classList.add("on");
}

document.getElementById("stage").addEventListener("click", e=>{
  const step = e.target.closest(".step");
  if(step) openStep(parseInt(step.dataset.seq,10));
});

/* 裁决展开 */
drawerBody.addEventListener("click", e=>{
  const head = e.target.closest(".rul-head");
  if(head) head.parentElement.classList.toggle("exp");
});

/* ===================== 开工上下文包预览 ===================== */
const pkgScrim = document.getElementById("pkgScrim");
const pkgTitle = document.getElementById("pkgTitle");
const pkgBody = document.getElementById("pkgBody");
const copyBtn = document.getElementById("copyBtn");

function buildPkgText(s){
  const lines = [];
  lines.push(`# 按决策树开工 · 前端设计域 第 ${s.seq} 步「${s.name}」`);
  lines.push(`项目:walker`);
  lines.push(``);
  lines.push(`## 这一步做什么`);
  lines.push(s.plain);
  lines.push(``);
  lines.push(`## 上一轮样例引用`);
  if(s.sampleIds.length){
    s.sampleIds.forEach(id=>{ const m=RAW.materials.find(x=>x.id===id); if(m) lines.push(`- ${m.id}(${KIND_LABEL[m.kind]} v${m.version}):${m.title}`); });
    if(s.companionIds) s.companionIds.forEach(id=>{ const m=RAW.materials.find(x=>x.id===id); if(m) lines.push(`- [评审伴生] ${m.id}:${m.title}`); });
  } else {
    lines.push(`(本域该层还没有材料样例,首轮产出即成为下一轮的引用。)`);
  }
  lines.push(``);
  lines.push(`## 适用裁决`);
  if(s.rulingIds.length){
    s.rulingIds.forEach(id=>{ const r=RULE(id); if(r) lines.push(`- ${id}:${r.statement}`); });
  } else {
    lines.push(`(本步无专属裁决;上游各步裁决同样适用。)`);
  }
  lines.push(``);
  lines.push(`## 门禁(须过才算这步完成)`);
  lines.push(`- 执法器:${s.gate}`);
  lines.push(`- ${s.gate_desc}`);
  lines.push(``);
  lines.push(`## 产出去向`);
  lines.push(`${s.sink.lane}泳道 · ${s.sink.form}`);
  return lines.join("\n");
}

function openPkg(){
  const s = currentStep; if(!s) return;
  pkgTitle.textContent = `第 ${s.seq} 步「${s.name}」· 项目 walker`;

  let h = "";
  h += `<div class="pkg-row">
    <div class="pk-label">${IC.info}项目</div>
    <div class="pk-val"><span class="proj-chip"><span class="dot"></span>walker</span></div>
  </div>`;
  h += `<div class="pkg-row">
    <div class="pk-label">${IC.layers}这一步做什么</div>
    <div class="pk-val">${s.plain}</div>
  </div>`;

  h += `<div class="pkg-row">
    <div class="pk-label">${IC.layers}上一轮样例引用</div>
    <div class="pk-val">`;
  if(s.sampleIds.length){
    s.sampleIds.forEach(id=>{ const m=RAW.materials.find(x=>x.id===id); if(m) h += `<div class="pkg-item"><span class="pi-mk">${m.id.replace('mat_','')}</span><span class="pi-tx"><b>${KIND_LABEL[m.kind]} v${m.version}</b> · ${m.title}</span></div>`; });
    if(s.companionIds) s.companionIds.forEach(id=>{ const m=RAW.materials.find(x=>x.id===id); if(m) h += `<div class="pkg-item"><span class="pi-mk">${IC.link}</span><span class="pi-tx"><b>评审伴生</b> · ${m.title}</span></div>`; });
  } else {
    h += `<span class="pkg-empty">本域该层还没有材料样例,首轮产出即成为下一轮引用。</span>`;
  }
  h += `</div></div>`;

  h += `<div class="pkg-row">
    <div class="pk-label">${IC.flag}适用裁决</div>
    <div class="pk-val">`;
  if(s.rulingIds.length){
    s.rulingIds.forEach(id=>{ const r=RULE(id); if(r) h += `<div class="pkg-item rul-ref"><span class="pi-mk">${shortId(id)}</span><span class="pi-tx">${r.statement}</span></div>`; });
  } else {
    h += `<span class="pkg-empty">本步无专属裁决;上游各步裁决同样适用。</span>`;
  }
  h += `</div></div>`;

  h += `<div class="pkg-row">
    <div class="pk-label">${IC.shield}门禁</div>
    <div class="pk-val"><div class="pkg-item gate-ref"><span class="pi-mk">${IC.shield}</span><span class="pi-tx"><b>${s.gate}</b> · ${s.gate_desc}</span></div></div>
  </div>`;

  pkgBody.innerHTML = h;
  copyBtn.classList.remove("done");
  copyBtn.querySelector("svg").nextSibling ; // no-op
  copyBtn.lastChild.textContent = "复制上下文包";
  pkgScrim.classList.add("on");
}

startBtn.addEventListener("click", openPkg);
document.getElementById("pkgClose").addEventListener("click", ()=> pkgScrim.classList.remove("on"));
pkgScrim.addEventListener("click", e=>{ if(e.target===pkgScrim) pkgScrim.classList.remove("on"); });

copyBtn.addEventListener("click", ()=>{
  const s = currentStep; if(!s) return;
  const txt = buildPkgText(s);
  const done = ()=>{ copyBtn.classList.add("done"); copyBtn.lastChild.textContent = "已复制"; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>{ fallbackCopy(txt); done(); });
  } else { fallbackCopy(txt); done(); }
});
function fallbackCopy(txt){
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    if(pkgScrim.classList.contains("on")) pkgScrim.classList.remove("on");
    else closeDrawer();
  }
});
</script>
