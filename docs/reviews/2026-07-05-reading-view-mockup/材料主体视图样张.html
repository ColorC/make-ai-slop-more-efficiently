<title>材料主体视图样张 · 窄列表切换 + 主屏留给材料本体</title>
<style>
  :root{
    --bg:#0b0e14;
    --panel:rgba(255,255,255,.04);
    --panel-2:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.12);
    --border-soft:rgba(255,255,255,.07);
    --ink:#dde3ee;
    --ink-dim:#9aa3b5;
    --ink-faint:#6b7385;
    --accent:#4c8dff;
    /* 三条产物层级冷色系(与轨迹样张 v2 同族) */
    --lane-a:#59b6c9;   /* 界面一览 青 */
    --lane-b:#7c8cf8;   /* 可玩演示 靛蓝 */
    --lane-c:#4c8dff;   /* 设计评审 亮蓝 */
    --ok:#57c98a;
    --warn:#e0b95a;
    --err:#e07a7a;
    --pending:#9aa3b5;
    /* 内容阅读区用近实色安静表面(域裁决 DEC-2026-07-04-085:玻璃只用于外壳) */
    --read-surface:#12151d;
    --read-surface-2:#161a24;
    --ease:cubic-bezier(.4,.8,.3,1);
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 82% -8%, rgba(76,141,255,.10), transparent 60%),
      radial-gradient(900px 600px at 4% 110%, rgba(124,140,248,.07), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    font-size:13px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .app{display:flex;height:100vh;}

  /* ============================================================
     左侧窄列表(玻璃外壳)
     ============================================================ */
  .rail{
    flex:0 0 var(--rail-w,300px);
    width:var(--rail-w,300px);
    display:flex;flex-direction:column;min-height:0;
    background:var(--panel);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-right:1px solid var(--border);
    transition:flex-basis .26s var(--ease), width .26s var(--ease);
    position:relative;z-index:5;
  }
  /* 展开态容器 */
  .rail-full{display:flex;flex-direction:column;height:100%;min-height:0;}
  /* 收起态:细条 */
  .app.rail-collapsed .rail{flex-basis:52px;width:52px;}
  .app.rail-collapsed .rail .rail-full{display:none;}
  .app:not(.rail-collapsed) .rail .rail-strip{display:none;}

  .rail-head{
    display:flex;align-items:center;gap:9px;
    padding:13px 14px 12px;
    border-bottom:1px solid var(--border-soft);
    flex:0 0 auto;
  }
  .rail-head .brand{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;}
  .rail-head .brand .t{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rail-head .brand .s{font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .icon-btn{
    flex:0 0 auto;width:28px;height:28px;border-radius:8px;
    border:1px solid var(--border-soft);background:var(--panel-2);color:var(--ink-dim);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s,border-color .15s;padding:0;
  }
  .icon-btn:hover{background:rgba(255,255,255,.1);color:var(--ink);border-color:var(--border);}
  .icon-btn svg{width:15px;height:15px;}

  /* 切到轨迹视图 小按钮(列表头) */
  .rail-actions{
    display:flex;align-items:center;gap:8px;
    padding:9px 12px;border-bottom:1px solid var(--border-soft);flex:0 0 auto;
  }
  .to-traj{
    display:inline-flex;align-items:center;gap:7px;flex:1;
    padding:7px 10px;border-radius:8px;
    background:rgba(76,141,255,.10);border:1px solid rgba(76,141,255,.28);
    color:#bcd2ff;font-size:12px;cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .to-traj:hover{background:rgba(76,141,255,.18);border-color:rgba(76,141,255,.45);}
  .to-traj svg{width:14px;height:14px;flex:0 0 auto;}

  .rail-scroll{overflow:auto;flex:1 1 auto;padding:8px 8px 24px;}

  .grp{margin:6px 4px 4px;}
  .grp-h{
    display:flex;align-items:center;gap:7px;
    padding:6px 8px 5px;
    font-size:12px;color:var(--ink-faint);letter-spacing:.4px;
  }
  .grp-h .lane-dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto;}
  .grp-h .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-faint);}

  /* 列表项:紧凑单行 */
  .li{
    display:flex;align-items:center;gap:8px;
    padding:8px 9px;margin:2px 0;border-radius:9px;
    cursor:pointer;position:relative;
    border:1px solid transparent;
    transition:background .14s var(--ease),border-color .14s;
  }
  .li:hover{background:var(--panel-2);}
  .li.active{
    background:linear-gradient(90deg, rgba(76,141,255,.16), rgba(76,141,255,.05));
    border-color:rgba(76,141,255,.42);
  }
  .li .kdot{
    flex:0 0 auto;width:7px;height:7px;border-radius:50%;
    background:var(--kc,var(--accent));box-shadow:0 0 6px var(--kc,var(--accent));
  }
  .li .lt{
    flex:1;min-width:0;font-size:13px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;
  }
  .li.active .lt{color:#eaf0fb;}
  .li .st{
    flex:0 0 auto;width:15px;height:15px;display:flex;align-items:center;justify-content:center;
  }
  .li .st svg{width:14px;height:14px;}
  /* 版本内联小片 */
  .li .ver-inline{display:inline-flex;gap:3px;flex:0 0 auto;margin-left:2px;}
  .verpill{
    font-size:12px;padding:0 6px;height:17px;line-height:17px;border-radius:5px;
    background:rgba(255,255,255,.05);border:1px solid var(--border-soft);
    color:var(--ink-faint);font-variant-numeric:tabular-nums;cursor:pointer;
    transition:background .14s,color .14s,border-color .14s;
  }
  .verpill:hover{color:var(--ink);background:rgba(255,255,255,.1);}
  .verpill.on{color:#eaf0fb;background:rgba(76,141,255,.22);border-color:rgba(76,141,255,.5);}

  /* 待你裁决 黄点 */
  .li .pin{
    flex:0 0 auto;width:8px;height:8px;border-radius:50%;
    background:var(--warn);box-shadow:0 0 7px rgba(224,185,90,.7);
  }
  /* 决策过程项 靛蓝旗 */
  .li .flagmark{flex:0 0 auto;width:15px;height:15px;color:#8f9dff;display:flex;align-items:center;justify-content:center;}
  .li .flagmark svg{width:14px;height:14px;}
  .li .sub{font-size:12px;color:var(--ink-faint);white-space:nowrap;flex:0 0 auto;}

  /* 收起态细条:图标竖列 */
  .rail-strip{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;height:100%;overflow:auto;}
  .rail-strip .sicon{
    width:34px;height:34px;border-radius:9px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;position:relative;
    border:1px solid var(--border-soft);background:var(--panel-2);color:var(--ink-dim);
    transition:background .14s,color .14s,border-color .14s;
  }
  .rail-strip .sicon:hover{background:rgba(255,255,255,.1);color:var(--ink);}
  .rail-strip .sicon.active{border-color:rgba(76,141,255,.5);color:#bcd2ff;background:rgba(76,141,255,.14);}
  .rail-strip .sicon .kdot{width:8px;height:8px;border-radius:50%;background:var(--kc,var(--accent));box-shadow:0 0 6px var(--kc,var(--accent));}
  .rail-strip .sicon .badge-warn{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:1.5px solid var(--bg);}
  .rail-strip .sicon svg{width:16px;height:16px;}
  .rail-strip .sdiv{width:22px;height:1px;background:var(--border-soft);margin:3px 0;}

  /* ============================================================
     主区(绝对主角)
     ============================================================ */
  .stagecol{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;}

  /* 主区顶栏(新口径) */
  .mtop{
    display:flex;align-items:center;gap:14px;
    padding:11px 20px;flex:0 0 auto;
    background:var(--panel);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    z-index:4;
  }
  .mtop .mt-title{
    font-size:15px;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw;
  }
  .mtop .mt-chips{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;padding:2px 9px;border-radius:6px;
    border:1px solid var(--border-soft);color:var(--ink-dim);
    background:rgba(255,255,255,.03);white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .chip.st-accepted{color:var(--ok);border-color:rgba(87,201,138,.35);background:rgba(87,201,138,.08);}
  .chip.st-pending{color:var(--warn);border-color:rgba(224,185,90,.32);background:rgba(224,185,90,.07);}
  .chip .ic{width:12px;height:12px;display:inline-flex;}
  .chip .ldot{width:7px;height:7px;border-radius:2px;}

  .mtop .actions{margin-left:auto;display:flex;align-items:center;gap:9px;flex:0 0 auto;}
  /* 通过/驳回 无文字图标键 30x30 */
  .act-icon{
    width:30px;height:30px;border-radius:9px;cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border-soft);background:var(--panel-2);
    transition:background .15s,border-color .15s,transform .12s;
  }
  .act-icon svg{width:16px;height:16px;}
  .act-icon:hover{transform:translateY(-1px);}
  .act-icon.approve{color:var(--ok);}
  .act-icon.approve:hover{background:rgba(87,201,138,.16);border-color:rgba(87,201,138,.5);}
  .act-icon.reject{color:var(--err);}
  .act-icon.reject:hover{background:rgba(224,122,122,.15);border-color:rgba(224,122,122,.5);}

  /* 更多 三点 + 菜单 */
  .more-wrap{position:relative;}
  .act-icon.more{color:var(--ink-dim);}
  .act-icon.more:hover{background:rgba(255,255,255,.1);border-color:var(--border);color:var(--ink);}
  .menu{
    position:absolute;top:38px;right:0;z-index:20;min-width:186px;
    background:linear-gradient(180deg, rgba(22,26,37,.98), rgba(16,19,28,.98));
    border:1px solid var(--border);border-radius:11px;
    box-shadow:0 16px 40px rgba(0,0,0,.5);
    padding:6px;
    opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;
    transition:opacity .18s var(--ease),transform .18s var(--ease);
  }
  .menu.open{opacity:1;transform:none;pointer-events:auto;}
  .menu .mi{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:8px;cursor:pointer;
    font-size:13px;color:var(--ink-dim);
    transition:background .13s,color .13s;
  }
  .menu .mi:hover{background:var(--panel-2);color:var(--ink);}
  .menu .mi svg{width:15px;height:15px;flex:0 0 auto;opacity:.85;}
  .menu .mi.danger{color:#d98f8f;}
  .menu .mi.danger:hover{background:rgba(224,122,122,.12);color:#e9a5a5;}
  .menu .msep{height:1px;background:var(--border-soft);margin:5px 4px;}

  /* 主体阅读区 */
  .reader-wrap{flex:1 1 auto;overflow:auto;min-height:0;position:relative;}
  .reader{
    max-width:920px;margin:0 auto;padding:34px 40px 90px;
  }

  /* ---- markdown 正文样式(安静近实色) ---- */
  .md{color:var(--ink);font-size:15px;line-height:1.72;}
  .md h1{font-size:23px;font-weight:600;line-height:1.35;margin:6px 0 18px;color:#eef2fa;letter-spacing:.2px;}
  .md h2{font-size:18px;font-weight:600;margin:30px 0 12px;color:#e6ecf7;padding-bottom:7px;border-bottom:1px solid var(--border-soft);}
  .md h3{font-size:15px;font-weight:600;margin:22px 0 9px;color:#e0e6f2;}
  .md p{margin:11px 0;color:var(--ink);}
  .md ul,.md ol{margin:11px 0;padding-left:24px;}
  .md li{margin:5px 0;color:var(--ink);}
  .md li::marker{color:var(--ink-faint);}
  .md strong{color:#fff;font-weight:600;}
  .md code{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    font-size:13px;background:rgba(255,255,255,.06);border:1px solid var(--border-soft);
    border-radius:5px;padding:1px 6px;color:#bcd2ff;
  }
  .md blockquote{
    margin:16px 0;padding:12px 16px;
    background:var(--read-surface-2);
    border-left:3px solid rgba(124,140,248,.6);
    border-radius:0 9px 9px 0;color:var(--ink-dim);font-size:14px;
  }
  .md blockquote p{margin:6px 0;color:var(--ink-dim);}
  .md blockquote strong{color:var(--ink);}
  .md table{
    border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px;
    background:var(--read-surface);border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;
  }
  .md th,.md td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--border-soft);}
  .md th{background:rgba(255,255,255,.04);color:var(--ink);font-weight:600;}
  .md tr:last-child td{border-bottom:none;}
  .md td{color:var(--ink-dim);}
  .md hr{border:none;border-top:1px solid var(--border-soft);margin:26px 0;}
  .md a{color:#7fb0ff;text-decoration:none;border-bottom:1px solid rgba(127,176,255,.35);}

  /* 评论卷宗(阅读区尾) */
  .cmt-fold{max-width:920px;margin:20px auto 0;padding:0 40px;}
  .cmt-fold .cf-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-faint);letter-spacing:.4px;margin:14px 0 12px;}
  .cmt-fold .cf-h::after{content:"";flex:1;height:1px;background:var(--border-soft);}
  .cmt-item{background:var(--read-surface);border:1px solid var(--border-soft);border-radius:10px;padding:11px 14px;margin-bottom:9px;}
  .cmt-item .ch{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .cmt-item .au{font-size:12px;color:var(--ink);font-weight:500;}
  .cmt-item .ct{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-left:auto;}
  .cmt-item .cc{font-size:13px;color:var(--ink-dim);}

  /* ---- demo/html/image 占位框 ---- */
  .placeholder{
    max-width:920px;margin:8px auto 0;
    border:1px dashed var(--border);border-radius:16px;
    background:linear-gradient(180deg, var(--read-surface), var(--read-surface-2));
    padding:52px 40px;text-align:center;
  }
  .placeholder .ph-ic{
    width:60px;height:60px;margin:0 auto 18px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(76,141,255,.10);border:1px solid rgba(76,141,255,.28);color:var(--accent);
  }
  .placeholder .ph-ic svg{width:30px;height:30px;}
  .placeholder .ph-t{font-size:16px;color:var(--ink);font-weight:600;margin-bottom:8px;}
  .placeholder .ph-s{font-size:13px;color:var(--ink-dim);max-width:560px;margin:0 auto 20px;line-height:1.7;}
  .placeholder .ph-url{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 18px;border-radius:10px;
    background:rgba(76,141,255,.14);border:1px solid rgba(76,141,255,.4);
    color:#cfe0ff;font-size:13px;cursor:pointer;
    font-variant-numeric:tabular-nums;transition:background .15s;
  }
  .placeholder .ph-url:hover{background:rgba(76,141,255,.22);}
  .placeholder .ph-url svg{width:15px;height:15px;}
  .placeholder .ph-meta{margin-top:22px;font-size:12px;color:var(--ink-faint);}

  /* ============================================================
     决策过程面板(沿用轨迹样张 v2 面板设计语言)
     ============================================================ */
  .decpanel{max-width:920px;margin:0 auto;padding:30px 40px 90px;}
  .decpanel .dp-lead{
    font-size:14px;color:var(--ink-dim);line-height:1.7;
    background:var(--read-surface-2);border:1px solid var(--border-soft);
    border-left:3px solid rgba(124,140,248,.6);border-radius:0 10px 10px 0;
    padding:13px 16px;margin-bottom:20px;
  }
  .dp-flow{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .dp-flow .fp{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;
    padding:4px 11px;border-radius:7px;border:1px solid var(--border-soft);
    background:rgba(255,255,255,.03);color:var(--ink-dim);
  }
  .dp-flow .fp.accepted{color:var(--ok);border-color:rgba(87,201,138,.35);background:rgba(87,201,138,.08);}
  .dp-flow .arrow{color:#7c8cf8;display:flex;}
  .dp-flow .arrow svg{width:16px;height:16px;}

  .dec-block{
    background:var(--read-surface);border:1px solid var(--border-soft);border-radius:13px;
    padding:17px 18px;margin-bottom:15px;position:relative;overflow:hidden;
  }
  .dec-block::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#7c8cf8,#4c8dff);}
  .dec-block .dtop{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .dec-block .did{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .dec-block .dstate{
    font-size:12px;padding:2px 9px;border-radius:6px;
    color:var(--ink-dim);border:1px solid var(--border-soft);background:rgba(255,255,255,.03);
  }
  .dec-block .dstate.proposed{color:var(--warn);border-color:rgba(224,185,90,.3);background:rgba(224,185,90,.07);}
  .dec-block .dstate.adopted{color:var(--ok);border-color:rgba(87,201,138,.3);background:rgba(87,201,138,.07);}
  /* 在轨迹中看这条边 */
  .dec-block .see-edge{
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
    font-size:12px;padding:4px 10px;border-radius:7px;cursor:pointer;
    background:rgba(76,141,255,.10);border:1px solid rgba(76,141,255,.28);color:#bcd2ff;
    transition:background .15s,border-color .15s;
  }
  .dec-block .see-edge:hover{background:rgba(76,141,255,.2);border-color:rgba(76,141,255,.45);}
  .dec-block .see-edge svg{width:13px;height:13px;}
  .dec-block .stmt{font-size:14px;color:var(--ink);line-height:1.65;margin-bottom:13px;}
  .quote{
    font-size:13px;color:var(--ink-dim);line-height:1.62;
    border-left:2px solid rgba(124,140,248,.5);padding:5px 12px 5px 13px;margin:11px 0;
    background:rgba(124,140,248,.05);border-radius:0 7px 7px 0;
  }
  .quote .qh{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:3px;}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .opt{
    display:flex;gap:10px;align-items:flex-start;
    padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.58;
    border:1px solid var(--border-soft);background:rgba(255,255,255,.02);
  }
  .opt.chosen{border-color:rgba(87,201,138,.35);background:rgba(87,201,138,.06);}
  .opt .mk{flex:0 0 auto;width:17px;height:17px;margin-top:1px;}
  .opt .mk svg{width:17px;height:17px;}
  .opt .otext{min-width:0;}
  .opt .oname{color:var(--ink);}
  .opt.chosen .oname{color:#a7e6c2;}
  .opt.rejected .oname{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25);}
  .opt .owhy{color:var(--ink-faint);margin-top:4px;font-size:12.5px;}
  .opt .owhy b{color:var(--ink-dim);font-weight:500;}

  /* ============================================================
     跳转提示条(样张内不真跳)
     ============================================================ */
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    z-index:50;max-width:560px;
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-radius:12px;
    background:linear-gradient(135deg, rgba(30,38,66,.98), rgba(22,28,50,.98));
    border:1px solid rgba(124,140,248,.5);
    box-shadow:0 18px 44px rgba(0,0,0,.5);
    color:#dbe2ff;font-size:13px;line-height:1.55;
    opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast .ti{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(124,140,248,.18);color:#aeb9ff;}

     {"author":"user","content":"e2e画布意见-1783179145782","created_at":"2026-07-04T15:32:25.952365+00:00","version":2}
  ],"content_md":"# walker UI v2 · 待裁决汇总（2026-07-04 第二版：五步全部完成，本版取代早间第一版）\n\n> 对应需求：你 07-04 原话「对比性的重新出发……所有交互层级甚至交互是否需要都可以重整，尽量不要受到旧有内容干扰」+ /goal「完成重建计划全部内容一个不剩」。\n> 完成度：**五步全部完成**。三份需求/提案 spec；新表现层 `src/screens/`（九屏全流程真可玩）；vitest 318 全绿；新一代 e2e 5 场景全绿（真 UI 路径+需求级探针）；testmap 27 功能点重映射；真玩录像一整局；独立评审（非执行方）成对比较：**违例清单为空**，报告与执行方逐条处置在游戏仓 `docs/reviews/2026-07-04-ui-v2-pairwise-review.md`。\n> 体验路径：①`npm run dev` 开 http://127.0.0.1:5173 从主菜单玩一局（新档→旅店点出发门→醒来之岸事件→走向第一回声→战斗里试试：点行动条→点落位槽移牌、点敌人换目标、拖时间刻度快进、空格暂停）；②或直接看真玩录像 `var/reports/ui2-e2e/selfplay/selfplay-20260704T043620.webm`（约 3 分钟一整局胜利）。\n\n## 请裁决 ①：指挥台三件合一（战斗屏中枢）\n\n已实装。每单位一条按拍对齐的轨道，行动=攻(橙)/守(青)/蓄(灰)分段条+结算亮刻+视界迷雾；备牌带只在选中角色时弹出；移牌/换目标/插入全部两步。独立评审确认\"一眼三件事/HUD≤25%/两步内\"全达标。**你上手玩一局后点头或推翻**——v1 可运行基线在 `archive/ui-v1-runnable` 分支，推翻可整体回退。\n\n## 请裁决 ②：操作入口后置的取舍（独立评审提出的真实代价）\n\n评审指出：v1 把\"提前/延后/换目标\"做成常显具名按钮，\"不用选中就知道能干什么\"；v2 按克制原则把这些藏进\"选中后才亮的落位槽/白圈\"。这是有意取舍（v1 按钮平铺正是被删病灶），但**可发现性代价是真的**。若你玩下来觉得\"不知道能干什么\"，方案有二：给空态引导加一句操作提示（轻），或给选中态加具名操作钮排（重、向 v1 回摆）。默认维持现状。\n\n## 请裁决 ③：移动两步直落 + 被砍清单 12+3（同第一版）\n\n移动=选中单位→点绿格直接下达（误点靠复位兜底）；砍：手动出牌/等待/旅店成长记忆商店空壳/牌库自由编辑器/wiki 抽屉玩家面/设置项等 12 项，预留改方向、敌情三态、指令卡 3 项。全部理由在交互清单第七节，已沉决策库（DEC-2026-07-04-003/004/005）。\n\n## 默认继续（精调清单，进入日常迭代不再单独请示）\n\n大世界底部浮卡去盒装感；打断/自动改向的专属棋盘动效（现仅轨道灰化+日志）；白圈/威胁线视觉强度；贴图风格包接入（现为素色板）；hexscene 模式大世界内容标记可读性。\n\n## 顺带\n\n早间第一版汇总（mat_f8a4b1a4dc2247e0）与 4 份 `gddecon-ui-build` 旧 pending 材料均已被本版取代，可直接略过/拒掉。\n"},
  {"id":"mat_f8a4b1a4dc2247e0","title":"walker UI v2 重建·设计提案评审门:三个裁决点(指挥台三件合一/移动两步直落/被砍清单12+3)，实施继续中可整体回退","kind":"markdown","status":"accepted","track":"设计评审","version":1,"version_family":"walker-ui-v2-重建评审","links":{},"created_at":"2026-07-03T21:41:34.123641+00:00","live_url":null,"file_relpath":"files/file_33804835e9244d47.md","comments":[],"content_md":"# walker UI v2 · 待裁决汇总（2026-07-04 第一版：设计提案评审门）\n\n> 对应需求：你 07-04 原话「对比性的重新出发……所有交互层级甚至交互是否需要都可以重整，尽量不要受到旧有内容干扰」。\n> 完成度：五步计划的前三步已完成（信息需求清单 33 条×9 屏、交互需求清单 36 条+砍 12 预留 3、九屏设计提案）；第四步实施按你的 /goal 指令继续推进中，不停等本汇总——v1 可运行基线冻结在 `archive/ui-v1-runnable` 分支，第五步会做新旧成对比较，本汇总任何一条被你否掉都能整体回退重做。\n> 体验路径：只需读下面三个裁决点（2 分钟）；要看推导细节再翻游戏仓 `docs/specs/ui-v2-{information-needs,interaction-needs,screen-design}.md` 三份。\n\n## 请批准 ①：战斗屏中枢改为\"指挥台\"（三件合一）\n\nv1 把同一批排队行动拆在三处（顶部时间带的签 + 底部上下文条的卡列 + 备牌带），同一张卡出现两次。v2 推导：玩法的中心对象是每个角色的行动序列，对轴博弈要求跨角色按拍对齐地看。所以合并成**一个底部多轨时间面**：每单位一条轨道、行动=攻/守/蓄分段条（v1 只有点状签，段看不见）、行动点亮刻、视界外迷雾截断；备牌带只在选中角色时从其轨道尾弹出；移牌/插入/换目标/移动全部在\"轨道+棋盘\"上两步完成。空闲态高度 ≤18%，总 HUD ≈20%（红线 25%）。\n\n## 请决断 ②：战斗内移动改两步直落（默认按此做）\n\n选中角色 → 板上可达格染绿（悬停即预演路径+费用）→ 点绿格**直接下达**。这偏离引擎 H2.7 的\"移动二次确认\"惯例。理由：UI 标准\"干预 ≤2 次点击\"是必须级；且 v2 里移动是排队指令（几拍后才结算）非即时位移，误点可用\"复位\"（撤回本次暂停全部干预、退还命令点）兜底。若你要保守，回复\"移动要确认\"即改三步。\n\n## 请批准 ③：被砍清单（12 砍 + 3 预留）\n\n从机制出发裁掉：手动出牌（判错方向不复活）、等待操作（你 06-14 已明示删）、提前/延后一格按钮、+1/+4 推进按钮（拖游标替代）、数字键选手牌、**旅店成长/记忆装备/商店面板**（逻辑层无机制，不做空壳）、**牌库自由编辑器**（机制只有奖励后换牌，旅店只留只读查看）、wiki 抽屉玩家面、demo 导览、奖励跳过、设置项（无音频/显示机制）、战斗中实时战评。预留（机制到了再做）：改方向/改位、敌情三态、指令卡。全部理由在交互清单第七节。\n\n## 默认继续（有异议随时说）\n\n敌我色=我青/敌赤；大世界用引擎 hexscene（文明式满屏六角）；终局呈现=战斗屏终态覆盖层（逻辑层本无 battle-result 场景）；旅店=满屏插画热点（复用既有生成图）。\n\n## 顺带清理\n\n审阅台里 4 份 `gddecon-ui-build` 的旧 pending 材料（可玩一局 demo/拆层对比图/战斗屏盘点/布阵屏设计稿）都是 v1 线产物，已被本次重启整体取代，可直接略过/拒掉，不必细看。\n"},

function fmtTime(iso){

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ===================== 极简 Markdown 渲染器(手写) ===================== */
/* 支持:# ## ### 标题 / 无序·有序列表 / **粗体** `行内码` / > 引用(含多行) / 表格 / --- 分隔 / 段落 */
function renderInline(t){
  let s = esc(t);
  // 行内代码先占位,避免其中的 ** 被当粗体
  const codes=[];
  s = s.replace(/`([^`]+)`/g, (m,p1)=>{ codes.push(p1); return `␀${codes.length-1}␀`; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // 裸链接
  s = s.replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/␀(\d+)␀/g, (m,i)=>`<code>${codes[+i]}</code>`);
  return s;
}
function renderMarkdown(md){
  const lines = md.replace(/\r\n/g,"\n").split("\n");
  let html="", i=0;
  const flushList = (buf, ordered)=>{
    if(!buf.length) return "";
    const tag = ordered?"ol":"ul";
    return `<${tag}>`+buf.map(x=>`<li>${renderInline(x)}</li>`).join("")+`</${tag}>`;
  };
  while(i<lines.length){
    let line = lines[i];
    // 空行
    if(/^\s*$/.test(line)){ i++; continue; }
    // 分隔线
    if(/^\s*---+\s*$/.test(line)){ html+="<hr>"; i++; continue; }
    // 标题
    let hm = line.match(/^(#{1,6})\s+(.*)$/);
    if(hm){ const lv=hm[1].length; html+=`<h${lv}>${renderInline(hm[2])}</h${lv}>`; i++; continue; }
    // 引用块(连续 > 行合并,块内空行也吃)
    if(/^\s*>/.test(line)){
      const buf=[];
      while(i<lines.length && (/^\s*>/.test(lines[i]) || (buf.length && /^\s{2,}\S/.test(lines[i])))){
        buf.push(lines[i].replace(/^\s*>\s?/,"")); i++;
      }
      html+=`<blockquote>`+buf.map(x=> x.trim()==="" ? "" : `<p>${renderInline(x)}</p>`).join("")+`</blockquote>`;
      continue;
    }
    // 表格(当前行含 | 且下一行是分隔行)
    if(line.includes("|") && i+1<lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
      const parseRow = r => r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
      const head = parseRow(line);
      i+=2;
      const rows=[];
      while(i<lines.length && lines[i].includes("|") && !/^\s*$/.test(lines[i])){ rows.push(parseRow(lines[i])); i++; }
      html+=`<table><thead><tr>`+head.map(h=>`<th>${renderInline(h)}</th>`).join("")+`</tr></thead><tbody>`+
        rows.map(r=>`<tr>`+r.map(c=>`<td>${renderInline(c)}</td>`).join("")+`</tr>`).join("")+`</tbody></table>`;
      continue;
    }
    // 无序列表
    if(/^\s*[-*]\s+/.test(line)){
      const buf=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ buf.push(lines[i].replace(/^\s*[-*]\s+/,"")); i++; }
      html+=flushList(buf,false); continue;
    }
    // 有序列表
    if(/^\s*\d+[.)]\s+/.test(line)){
      const buf=[];
      while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ buf.push(lines[i].replace(/^\s*\d+[.)]\s+/,"")); i++; }
      html+=flushList(buf,true); continue;
    }
    // 段落(合并连续非空非结构行)
    const buf=[line];
    i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|\s*>|\s*[-*]\s|\s*\d+[.)]\s|\s*---+\s*$)/.test(lines[i]) && !lines[i].includes("|")){
      buf.push(lines[i]); i++;
    }
    html+=`<p>${renderInline(buf.join(" "))}</p>`;
  }
  return html;
}

/* ===================== 视图状态 ===================== */
let currentSel = null;         // {type:'material', id} | {type:'decproc'} | {type:'pending', id}
let versionPick = {};          // version_family -> 选中的 material id

/* 按 version_family 归组(同族多版本) */
function familyOf(m){ return m.version_family || m.id; }
function materialsByTrack(track){
  const list = DATA.materials.filter(m=>m.track===track);
  // 同族聚为一组,取最新版做代表
  const fams = {};
  list.forEach(m=>{ const f=familyOf(m); (fams[f]=fams[f]||[]).push(m); });
  Object.values(fams).forEach(arr=> arr.sort((a,b)=>b.version-a.version));
  return Object.values(fams);
}
function activeMaterialOfFamily(fam){
  const f = familyOf(fam[0]);
  if(versionPick[f]){ const p = fam.find(m=>m.id===versionPick[f]); if(p) return p; }
  return fam[0]; // 默认最新
}

/* ===================== 渲染左侧列表 ===================== */
function renderRail(){
  const scroll = document.getElementById("railScroll");
  let html = "";

  // 第一组:按产物层级(界面一览/可玩演示/设计评审)
  TRACKS.forEach(tr=>{
    const fams = materialsByTrack(tr.name);
    if(!fams.length) return;
    html += `<div class="grp">
      <div class="grp-h"><span class="lane-dot" style="background:${tr.color}"></span>${tr.name}<span class="cnt">${fams.length}</span></div>`;
    fams.forEach(fam=>{
      const rep = activeMaterialOfFamily(fam);
      const multi = fam.length>1;
      const kc = KIND_COLOR[rep.kind]||tr.color;
      const active = currentSel && currentSel.type==="material" && familyOf(fam[0])===(DATA.materials.find(m=>m.id===currentSel.id)? familyOf(DATA.materials.find(m=>m.id===currentSel.id)) : null);
      const stIc = rep.status==="accepted" ? IC.check : "";
      let verInline = "";
      if(multi){
        verInline = `<span class="ver-inline">` + fam.slice().sort((a,b)=>a.version-b.version).map(m=>{
          const on = rep.id===m.id;
          return `<span class="verpill ${on?'on':''}" data-fam="${familyOf(fam[0])}" data-mid="${m.id}">v${m.version}</span>`;
        }).join("") + `</span>`;
      }
      html += `<div class="li ${active?'active':''}" data-type="material" data-mid="${rep.id}">
        <span class="kdot" style="--kc:${kc}"></span>
        <span class="lt" title="${esc(rep.title)}">${esc(shortTitle(rep.title))}</span>
        ${verInline}
        <span class="st">${stIc}</span>
      </div>`;
    });
    html += `</div>`;
  });

  // 第二组:决策过程
  const edp = DATA.edge_decision_process;
  const activeDP = currentSel && currentSel.type==="decproc";
  html += `<div class="grp" style="margin-top:14px">
    <div class="grp-h" style="color:#8f9dff"><span class="flagmark" style="width:13px;height:13px">${IC.flag}</span>决策过程</div>
    <div class="li ${activeDP?'active':''}" data-type="decproc">
      <span class="flagmark">${IC.flag}</span>
      <span class="lt">v1 → v2 · ${edp.decisions.length} 项裁决</span>
    </div>
  </div>`;

  // 待你裁决(黄点)
  const pend = DATA.pending_decisions;
  html += `<div class="grp" style="margin-top:8px">
    <div class="grp-h"><span class="pin" style="width:8px;height:8px"></span>待你裁决<span class="cnt">${pend.length}</span></div>`;
  pend.forEach(d=>{
    const active = currentSel && currentSel.type==="pending" && currentSel.id===d.id;
    html += `<div class="li ${active?'active':''}" data-type="pending" data-did="${d.id}">
      <span class="pin"></span>
      <span class="lt" title="${esc(d.statement)}">${esc(shortDec(d.statement))}</span>
      <span class="sub">${d.id.replace('DEC-2026-07-04-','#')}</span>
    </div>`;
  });
  html += `</div>`;

  scroll.innerHTML = html;

  // 绑定
  scroll.querySelectorAll(".li").forEach(li=>{
    li.addEventListener("click", e=>{
      if(e.target.classList.contains("verpill")) return; // 版本片单独处理
      const t = li.dataset.type;
      if(t==="material") selectMaterial(li.dataset.mid);
      else if(t==="decproc") selectDecProc();
      else if(t==="pending") selectPending(li.dataset.did);
    });
  });
  scroll.querySelectorAll(".verpill").forEach(vp=>{
    vp.addEventListener("click", e=>{
      e.stopPropagation();
      versionPick[vp.dataset.fam] = vp.dataset.mid;
      selectMaterial(vp.dataset.mid);
    });
  });

  renderStrip();
}
function shortTitle(t){
  // 取第一段核心,去掉长括注,便于紧凑单行
  let s = t.split("——")[0].split("·")[0];
  const idx = s.indexOf("(");
  if(idx>0 && idx<26) s = s.slice(0, s.indexOf("(")>=0? s.length : s.length); // 保留,靠 ellipsis
  return t; // 交给 CSS ellipsis + title 悬停全文
}
function shortDec(s){ return s.split(":")[0].split("(")[0]; }

  const activeP = currentSel && currentSel.type==="pending";
  html += `<div class="sicon ${activeP?'active':''}" data-type="pending-first" title="待你裁决 · ${DATA.pending_decisions.length} 条" style="color:#e0b95a">${IC.flag}<span class="badge-warn"></span></div>`;

  strip.innerHTML = html;

    });
  });
}

function selectMaterial(mid){
  const m = DATA.materials.find(x=>x.id===mid);
  if(!m) return;
  currentSel = {type:"material", id:mid};

  const kc = KIND_COLOR[m.kind]||trackColor(m.track);
  renderTopbar({
    title: m.title,
    chips:[
      {cls:"", html:`<span class="ldot" style="background:${trackColor(m.track)}"></span>${m.track}`},
      {cls:"", html:`${KIND_LABEL[m.kind]||m.kind}`},
      {cls:"", html:`v${m.version}`},
      {cls: m.status==="accepted"?"st-accepted":"st-pending",
       html: `${m.status==="accepted"?`<span class="ic">${IC.check}</span>`:""}${STATUS_LABEL[m.status]||m.status}`},
    ]
  });

  const wrap = document.getElementById("readerWrap");
  if(m.kind==="markdown" && m.content_md){

      html += `<div class="cmt-fold"><div class="cf-h">评论 · ${m.comments.length}</div>` +
        m.comments.map(c=>`<div class="cmt-item"><div class="ch"><span class="au">${esc(c.author)}</span><span class="ct">${c.created_at?fmtDay(c.created_at):""}</span></div><div class="cc">${esc(c.content)}</div></div>`).join("") +

        ? "这是可点开即玩的游戏本体。正式视图里此处内嵌实时画面（驾驶舱托管的 live 页），样张中以占位框示意，点下方按钮在新标签打开。"
        : m.kind==="image"
        ? "这是六屏一览图。正式视图里此处直接渲染原图（可缩放查看），样张中以占位框示意。"
        : "这是网页材料。正式视图里此处内嵌 live 页，样张中以占位框示意。";

        ? `<div class="ph-url">${IC.open}打开材料 · ${esc(m.live_url)}</div>`
        : (m.file_relpath ? `<div class="ph-meta">文件：${esc(m.file_relpath)}</div>` : "");
    let ph = `<div class="reader" style="padding-top:24px"><div class="placeholder">
        <div class="ph-ic">${kic}</div>
        <div class="ph-t">${kdesc}</div>
        <div class="ph-s">${sub}</div>
        ${urlLine}
        ${m.live_url && m.file_relpath?`<div class="ph-meta">文件：${esc(m.file_relpath)}</div>`:""}
      </div>`;
    if(m.comments && m.comments.length){
      ph += `<div class="cmt-fold"><div class="cf-h">评论 · ${m.comments.length}</div>` +
        m.comments.map(c=>`<div class="cmt-item"><div class="ch"><span class="au">${esc(c.author)}</span><span class="ct">${c.created_at?fmtDay(c.created_at):""}</span></div><div class="cc">${esc(c.content)}</div></div>`).join("")+`</div>`;
    }
    ph += `</div>`;
    wrap.innerHTML = ph;
  }
  wrap.scrollTop = 0;
  renderRail();
}

  wrap.scrollTop = 0;

  wrap.querySelectorAll(".see-edge").forEach(b=>{
    b.addEventListener("click", ()=> jumpToTrajectory("在轨迹中定位这条承袭边上的裁决", `边 v1→v2 · ${b.dataset.did}`));
  });
  renderRail();
}

/* ===================== 选择「待你裁决」单条 → 主区裁决面板(单条) ===================== */
function selectPending(did){
  const d = DATA.pending_decisions.find(x=>x.id===did);
  if(!d) return;
  currentSel = {type:"pending", id:did};

  renderTopbar({
    title: d.statement.split(":")[0].split("(")[0],
    chips:[
      {cls:"", html:`<span class="ldot" style="background:#e0b95a"></span>待你裁决`},
      {cls:"st-pending", html:`提议中`},
      {cls:"", html:`${d.id.replace('DEC-2026-07-04-','#')}`},
    ]
  });

  const wrap = document.getElementById("readerWrap");
  let html = `<div class="decpanel">
    <div class="dp-lead">这是一条待你拍板的裁决。顶栏 <b>✓ 通过</b> / <b>✕ 驳回</b> 即完成裁决；要看它落在决策全景里的位置，点下方“在轨迹中看这条边”。</div>
    <div class="dec-block">
      <div class="dtop">
        <span class="did">${d.id}</span>
        <span class="dstate ${d.status}">${d.status==='proposed'?'提议中':'已采纳'}</span>
        <span class="see-edge" data-did="${d.id}">${IC.edge}在轨迹中看这条边</span>
      </div>
      <div class="stmt">${esc(d.statement)}</div>
      <div class="quote"><span class="qh">理由</span>${esc(d.rationale)}</div>
      <div class="opts">
        ${d.decision_space.map(o=>`
          <div class="opt ${o.chosen?'chosen':'rejected'}">
            <div class="mk">${o.chosen?IC.check:IC.cross}</div>
            <div class="otext">
              <div class="oname">${esc(o.option)}</div>
              <div class="owhy"><b>${o.chosen?'选中理由':'被否理由'}：</b>${esc(o.why)}</div>
            </div>
          </div>`).join("")}
      </div>
    </div>
    <div style="font-size:12px;color:var(--ink-faint);margin-top:14px">锚点：${esc(d.anchor_ref)}</div>
  </div>`;
  wrap.innerHTML = html;
  wrap.scrollTop = 0;
  wrap.querySelectorAll(".see-edge").forEach(b=>{
    b.addEventListener("click", ()=> jumpToTrajectory("在轨迹中定位这条裁决", `裁决 ${b.dataset.did}`));
  });
  renderRail();
}

/* ===================== 跳转提示条(样张内不真跳) ===================== */
let toastTimer=null;
function jumpToTrajectory(msg, tgt){
  const t = document.getElementById("toast");
  document.getElementById("toastIc").innerHTML = IC.traj;
  document.getElementById("toastMsg").textContent = msg;
  document.getElementById("toastTgt").textContent = "目标：决策轨迹视图 · " + tgt;
  t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"), 4200);
}
function flash(msg, tgt){
  const t = document.getElementById("toast");
  document.getElementById("toastIc").innerHTML = IC.checkC.replace('#57c98a','currentColor');
  document.getElementById("toastMsg").textContent = msg;
  document.getElementById("toastTgt").textContent = tgt? ("材料："+tgt) : "";
  t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"), 3200);
}
document.getElementById("toastClose").addEventListener("click", ()=> document.getElementById("toast").classList.remove("show"));
document.getElementById("toTrajBtn").addEventListener("click", ()=> jumpToTrajectory("切到决策轨迹视图", "行者无乡 · 全泳道决策轨迹"));

function trajTargetForCurrent(){
  if(currentSel && currentSel.type==="material"){ const m=DATA.materials.find(x=>x.id===currentSel.id); return "材料节点 · "+(m?m.title.slice(0,18)+"…":currentSel.id); }
  if(currentSel && currentSel.type==="decproc") return "承袭边 v1→v2";
  if(currentSel && currentSel.type==="pending") return "裁决 "+currentSel.id;
  return "当前选中";
}
function currentFileHint(){
  if(currentSel && currentSel.type==="material"){ const m=DATA.materials.find(x=>x.id===currentSel.id); return m? (m.file_relpath||m.live_url||m.id) : ""; }
  return "";
}

function setCollapsed(v){
  document.getElementById("app").classList.toggle("rail-collapsed", v);
}
document.getElementById("collapseBtn").addEventListener("click", ()=> setCollapsed(true));
