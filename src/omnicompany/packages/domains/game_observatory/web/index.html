<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <meta name="description" content="按游戏浏览系统文章，理解玩家目标、使用流程、关键概念、主要规则和相关系统。">
  <meta name="color-scheme" content="light dark">
  <title>游戏系统资料库</title>
  <link rel="stylesheet" href="/game-observatory/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>
  <div class="grain" aria-hidden="true"></div>
  <header class="masthead">
    <a class="brand" href="/game-observatory/" data-home>
      <span><strong>游戏系统资料库</strong><small>看懂系统、规则与界面</small></span>
    </a>
    <nav aria-label="主要导航">
      <button class="nav-link is-active" data-home>游戏</button>
    </nav>
    <a class="studio-entry" href="/game-observatory/studio/">浏览全部系统</a>
  </header>

  <main id="app" data-testid="game-observatory-app">
    <section class="hero">
      <p class="eyebrow">按游戏浏览</p>
      <h1>从游戏进入系统</h1>
      <p class="hero-copy">选择一款游戏，了解它有哪些系统、玩家为什么使用、怎样操作，以及系统之间如何连接。</p>
      <div class="hero-stats" data-stats></div>
    </section>

    <section class="catalog-shell" data-catalog-shell>
      <aside class="filters">
        <label class="search-box">
          <span>搜索游戏系统</span>
          <input type="search" placeholder="系统、玩家目标、概念或规则…" data-search>
        </label>
        <div class="filter-label">主题标签</div>
        <div class="tag-cloud" data-tags></div>
        <button class="clear-filter" data-clear>清除筛选</button>
      </aside>
      <section class="catalog">
        <div class="section-head">
          <div><p class="eyebrow">游戏目录</p><h2>选择游戏</h2></div>
          <span data-result-count aria-live="polite">载入中</span>
        </div>
        <div class="report-grid" data-report-grid></div>
      </section>
    </section>

    <section class="game-view" data-game-view hidden></section>
    <section class="report-view" data-report-view hidden></section>
  </main>

  <footer>
    <span>游戏系统资料库 · 从玩家目标理解系统设计</span>
    <span>按游戏浏览 · 按系统深入</span>
  </footer>
  <script type="module" src="/game-observatory/app.js"></script>
</body>
</html>
