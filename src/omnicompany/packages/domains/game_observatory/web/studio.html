<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:,">
  <title>游戏设计资料库</title>
  <link rel="stylesheet" href="/game-observatory/studio.css">
</head>
<body>
  <a class="skip-link" href="#workspace">跳到工作区</a>
  <header class="studio-header">
    <a class="studio-brand" href="/game-observatory/studio/">
      <strong>游戏设计资料库</strong>
      <span>从系统进入机制、操作与规则</span>
    </a>
    <nav class="studio-nav" aria-label="资料库导航">
      <a href="/game-observatory/studio/" data-surface="overview">游戏</a>
      <a href="/game-observatory/studio/search" data-surface="search">搜索</a>
    </nav>
    <a class="public-link" href="/game-observatory/">资料库首页</a>
  </header>
  <main id="workspace" class="studio-main" data-testid="game-observatory-studio">
    <div class="loading-card" data-loading>
      <span></span>
      <strong>正在读取游戏资料</strong>
    </div>
  </main>
  <div class="studio-toast" data-toast hidden></div>
  <dialog class="image-viewer" data-image-viewer aria-label="查看游戏界面大图">
    <form method="dialog"><button type="submit" aria-label="关闭大图">关闭</button></form>
    <figure>
      <img data-image-viewer-image alt="">
      <figcaption data-image-viewer-caption></figcaption>
    </figure>
    <a data-image-viewer-source target="_blank" rel="noopener noreferrer">在新窗口查看原图</a>
  </dialog>
  <script type="module" src="/game-observatory/studio.js"></script>
</body>
</html>
