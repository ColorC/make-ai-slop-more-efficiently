# [OMNI] origin=claude-code domain=omnicompany/packages/services/_governance ts=2026-07-04T00:00:00+08:00 type=data
# testmap.yaml — 治理面(_governance 包)的功能点-测试对照表。真源跟随治理包(omnicompany 仓内)。
# 契约定义: src/omnicompany/packages/services/_governance/testmap.py(load_testmap)
# 上位计划: docs/plans/omnicompany-governance/[2026-07-04]PERIODIC-UPKEEP-COMPLETION-FIRST/plan.md
#
# 本表登记 2026-07-04 落地的「周期整理强化: 完成优先与标准位置留痕」计划引入的全部新行为
# (批1 密度分层 / 批2 标准位置留痕 / 批3 完成型升级 + 真空补齐 的可测部分)。本包自身没有独立
# DESIGN.md(README.md 讲的是 plan_steward/work_history 等子部门, 不覆盖 testmap/patrol/gate 这些
# 顶层模块), 故 doc 指向上位计划文档。cases 均为 pytest 测试函数名字面子串, 已用 Grep 逐条核实
# 真实存在于对应文件, 不臆造。
#
# 绑定登记: data/registry/plan_bindings.json 已为上位计划登记 testmaps=[omnicompany-governance],
# 完成硬闸(plan_completion_gate.py)据此判定本表(或其登记测试锚)在 registered_at 之后是否有变更。

app: omnicompany-governance
doc: ../../../../../docs/plans/omnicompany-governance/[2026-07-04]PERIODIC-UPKEEP-COMPLETION-FIRST/plan.md
gates:
  - id: unit
    cmd: venv\Scripts\python.exe -m pytest tests/governance tests/guardian/test_patrol_lock.py tests/domains/test_atlas_health.py tests/cli/test_plan_gate_command.py -q
    cwd: ../../../../..

features:
  # ── 批1 密度分层: patrol 非阻塞跳过锁 + cron 工作量触发调密不误触发 ──────────
  - id: patrol.nonblocking_skip_lock
    what: patrol 提到心跳级后必须是"跳过锁"而不是"排队锁"——新鲜锁下并发调用直接跳过, 僵死锁能被接管, 正常跑完锁会被清理
    should:
      - "新鲜锁(<15min)存在时 run_patrol 直接返回 skipped, violations 为空"
      - "僵死锁(started_at 早于阈值, 如 2 小时前)会被接管, patrol 正常执行"
      - "正常跑完一轮后锁文件被清理, 不残留"
      - "并发场景: 第一个调用进入未释放期间, 第二个调用必须被跳过(计划错误样本①, 不允许并发重跑)"
    tests:
      - file: ../../../../../tests/guardian/test_patrol_lock.py
        cases:
          - "test_fresh_lock_skips_without_running"
          - "test_stale_lock_is_taken_over_and_runs_normally"
          - "test_lock_released_after_normal_run"
          - "test_concurrent_second_call_is_skipped___error_sample_1"
    status: covered

  - id: cron.density_retune_baseline_carryover
    what: 密度分层调参(如 testmap-review 50→20 提交、atlas-refresh 30→15 提交)后, 工作量触发的 baseline 必须顺延到当前值, 不能因为改小阈值就让"过去已经攒够的工作量"立刻误触发
    should:
      - "调密后紧跟着的判定不会因 baseline 未顺延而立即误触发(计划错误样本②)"
      - "当累计工作量增量真正达到新阈值后, is_work_due 判定为到期"
    tests:
      - file: ../../../../../tests/guardian/test_patrol_lock.py
        cases:
          - "test_retuned_tasks_not_due_right_after_baseline_advance___error_sample_2"
          - "test_retuned_tasks_due_when_delta_reaches_every___error_sample_2"
    status: covered

  # ── 批2 标准位置留痕: OMNI-100 提醒读侧派生 + 确定性消化 ──────────────────
  - id: testmap.reminders_derivation_and_digestion
    what: guardian 巡逻产生的 OMNI-100 罚单不新造推送通道, 而是读侧派生成该 app 的 testmap 提醒——按子树归属过滤、按"测试面变更时间晚于违规发现时间"做确定性消化判定、7 天窗口内去重
    should:
      - "违规路径落在该 testmap 子树内才归属为该 app 的提醒, 子树外的违规不误纳入"
      - "testmap.yaml 或其登记的测试锚在违规发现之后有变更时, 该条提醒视为已消化, 不再出现(负路径: 消化后必须消失)"
      - "测试面变更早于违规发现时间时提醒仍是活跃态(负路径: 无变更不能被误判为已消化)"
      - "7 天窗口外的 patrol 日志不纳入扫描, 窗口内的正常纳入"
      - "同一 path + 同一天(日期粒度)只保留一条, 不重复堆积"
    tests:
      - file: ../../../../../tests/governance/test_testmap_reminders.py
        cases:
          - "test_collect_reminders_hits_violation_in_testmap_subtree"
          - "test_collect_reminders_ignores_violation_outside_subtree"
          - "test_collect_reminders_digested_when_detected_before_testmap_mtime"
          - "test_collect_reminders_active_when_detected_after_testmap_mtime___error_sample_positive"
          - "test_collect_reminders_ignores_log_older_than_7_days"
          - "test_collect_reminders_includes_log_within_7_days"
          - "test_collect_reminders_dedups_same_path_and_date"
    status: covered

  - id: testmap.reminders_cli_surface_no_pollution
    what: 提醒必须呈现在"下次要动这个软件的人必经"的标准查询面(omni testmap show/list), 且无提醒时输出不能被污染出多余空段落(负路径)
    should:
      - "sync_registry 写回注册表时新增 attrs.reminders 键, 同时不抹掉既有 gates/review 键"
      - "有未消化提醒时 show 命令输出顶部显示警告行"
      - "无提醒时 show 命令输出与未接入提醒功能前完全一致, 不多出空段落(负路径)"
      - "list 命令行尾会附加提醒计数 token"
      - "提醒数为 0 时 list 命令行尾不出现提醒 token(负路径)"
    tests:
      - file: ../../../../../tests/governance/test_testmap_reminders.py
        cases:
          - "test_sync_registry_adds_reminders_while_preserving_gates_and_review"
          - "test_show_cli_outputs_warning_line_when_reminders_present"
          - "test_show_cli_output_unchanged_when_no_reminders___error_sample_2"
          - "test_list_cli_appends_reminder_count_to_row"
          - "test_list_cli_no_reminder_token_when_zero"
    status: covered

  - id: testmap.registry_merge_semantics
    what: sync_registry / run_gates 写回同一注册表条目时必须保留合并语义——verify/gates/review/reminders 四个键互不抹掉, 门禁真跑的红/绿如实记录不吞错
    should:
      - "sync_registry 写入的条目 counts 与实际 covered/gap/stale 分布一致"
      - "锚文件缺失的功能点被记为 stale 而不是被吞掉"
      - "sync_registry 重跑不会抹掉此前已写入的 gates 键(合并语义)"
      - "gate 命令非零退出码必须记为 red, 不允许吞错记绿"
      - "gate 命令零退出码记为 green"
      - "gate 命令超时必须记为 red(不允许挂起或误记绿)"
    tests:
      - file: ../../../../../tests/governance/test_testmap_sync.py
        cases:
          - "test_sync_registry_writes_entry_with_correct_counts"
          - "test_sync_registry_records_stale_count_for_missing_anchor"
          - "test_sync_registry_preserves_existing_gates_attr"
          - "test_run_gates_red_on_nonzero_exit"
          - "test_run_gates_green_on_zero_exit"
          - "test_run_gates_red_on_timeout"
    status: covered

  # ── 批3 完成型升级: 计划完成硬闸 ──────────────────────────────────────────
  - id: gate.plan_completion_hard_gate
    what: 计划转完成态前查其绑定软件的 testmap 自计划开工(registered_at)后有无新增/更新, 没有变更则拒绝转完成态(执行方自认完成不算数); 未纳管/非功能性/未声明 testmaps 的计划则放行不阻断
    should:
      - "计划未纳管 binding(binding=None)时放行, 理由含'未纳管'"
      - "binding 存在但 write_targets 与 testmaps 均为空(纯文档/非功能性计划)时放行, 理由含'非功能性'或'不适用'(负路径)"
      - "binding 是功能性(write_targets 非空)但未声明 testmaps 时放行, 理由建议补声明"
      - "声明的 testmap app 在 discover 结果里找不到时拒绝, 理由含'不存在', details.missing_apps 列出该 app"
      - "声明的 app 存在且其 testmap/测试锚在 registered_at 之后有变更(mtime 更晚)时放行"
      - "声明的 app 存在但自 registered_at 起无任何变更时拒绝, 理由含'无变更'(负路径: 执行方自认完成不算数)"
      - "声明多个 app 时只要任一 app 有变更即放行"
      - "registered_at 字段本身无法解析时不阻断, 放行"
    tests:
      - file: ../../../../../tests/governance/test_plan_completion_gate.py
        cases:
          - "test_no_binding_allows"
          - "test_binding_without_write_targets_and_testmaps_allows"
          - "test_functional_binding_without_testmaps_allows_with_suggestion"
          - "test_declared_app_not_found_refuses"
          - "test_declared_app_changed_after_registered_at_allows"
          - "test_declared_app_unchanged_since_registered_at_refuses"
          - "test_multiple_apps_any_changed_allows"
          - "test_unparseable_registered_at_does_not_block"
    status: covered

  - id: gate.plan_complete_gate_cli_tristate
    what: omni plan-complete-gate CLI 是 whatnow 完成流转唯一挂点, 退出码必须精确三态(0=allow / 2=refuse / 1=内部错误), 不允许把内部异常悄悄吞成拒绝或放行
    should:
      - "判定结果 allow=True 时退出码为 0, --json 输出结构化载荷且 allow 字段为 true"
      - "判定结果 allow=False 时退出码为 2, 输出里包含拒绝理由文本"
      - "evaluate 内部抛异常时退出码为 1(内部错误, 与业务拒绝态严格区分)"
    tests:
      - file: ../../../../../tests/cli/test_plan_gate_command.py
        cases:
          - "test_allow_exits_zero"
          - "test_refuse_exits_two"
          - "test_internal_error_exits_one"
    status: covered

  # ── 批3 真空补齐: 项目索引五项体检 ────────────────────────────────────────
  - id: project_index.five_point_check_and_unique_fix
    what: PROJECT_INDEX.md 五项确定性体检(缺失/契约/仓内死链/YAML 字段死路径/quick_actions 存在性), 死链只在候选唯一时自动重指, 有歧义候选时只报不修(负路径), 外部链接绝不触碰
    should:
      - "docs/projects/ 下项目缺 PROJECT_INDEX.md 时报缺失 finding"
      - "PROJECT_INDEX.md 存在但 frontmatter 不合契约(如缺失/不闭合)时报契约违规 finding"
      - "frontmatter 与内容均合规时不产出任何 finding(负路径: 全绿不报噪声)"
      - "正文里的仓内死链在只有唯一匹配候选时被自动重指为正确路径, 同文件里其余正常链接不受影响"
      - "正文死链存在多个候选(歧义)时不自动修改, 只报 finding(负路径: 歧义必须只报不修)"
      - "外部链接(URL/仓外路径)在体检与修复流程中绝不被触碰或误改"
      - "YAML frontmatter 字段里的死路径同样遵守'唯一候选才修, 歧义不修'规则"
      - "quick_actions 绑定的 skill 存在性体检复用现成 actions-check 核心逻辑, 不重写一套"
    tests:
      - file: ../../../../../tests/governance/test_project_index_steward.py
        cases:
          - "test_missing_index_reported"
          - "test_contract_violation_no_frontmatter"
          - "test_contract_ok_no_finding"
          - "test_broken_ref_unique_candidate_fixed_rest_unchanged"
          - "test_broken_ref_ambiguous_not_fixed"
          - "test_external_links_never_touched"
          - "test_yaml_field_unique_candidate_fixed"
          - "test_yaml_field_ambiguous_not_fixed"
          - "test_quick_actions_uses_actions_check_core"
    status: covered

  - id: project_index.semantic_gap_candidate_dedup
    what: 语义补漏候选区(性价比模型产出)写进 index 固定「自动补漏候选」小节, 重跑不重复堆积同一条目, 且补漏候选不得越界改写进度指针(whatnow 指针不属于补漏可动区)
    should:
      - "首次产出补漏候选后候选区被创建; 重跑同样输入不会在候选区追加重复条目(去重)"
      - "候选区的进度类建议只落在候选小节内, 不会外溢改写 index 里的 whatnow 进度指针(负路径)"
      - "体检全绿时新鲜度戳(last_verified)被写入; 存在 finding 时不写入新鲜度戳(负路径)"
      - "既有候选行的去重判定逻辑本身有单测覆盖(字符串级去重辅助函数)"
    tests:
      - file: ../../../../../tests/governance/test_project_index_steward.py
        cases:
          - "test_candidate_block_created_then_no_duplicate_on_rerun"
          - "test_candidate_progress_suggestion_only_lands_in_block"
          - "test_freshness_stamp_applied_when_all_green"
          - "test_freshness_stamp_not_applied_when_has_finding"
          - "test_existing_candidate_lines_dedup_helper"
    status: covered

  # ── 批3 真空补齐: 技能库每日确定性健康巡检 ────────────────────────────────
  - id: atlas.skill_health_parse_check
    what: 技能库健康巡检的解析体检——BOM 字节、frontmatter 未闭合、缺 name/description 必填字段均产出 finding, 全部合规时零 finding
    should:
      - "SKILL.md 带 BOM 字节时产出 finding"
      - "frontmatter 未闭合(缺结束 ---)时产出 finding"
      - "缺 name 或 description 必填字段时产出 finding"
      - "解析与导出全部合规时零 finding(负路径: 全绿不报噪声)"
    tests:
      - file: ../../../../../tests/domains/test_atlas_health.py
        cases:
          - "test_bom_is_finding"
          - "test_unclosed_frontmatter_is_finding"
          - "test_missing_name_or_description_is_finding"
          - "test_all_green_no_findings"
    status: covered

  - id: atlas.export_drift_apply_fix
    what: 技能库导出漂移体检——canonical 与各生效目录(claude/codex)内容不一致或缺失时报漂移, --apply 能据 canonical 真源修复; 非本设施管理的技能不被误判或误碰; 死绝对路径只报不修
    should:
      - "生效目录缺失某技能的导出文件时报漂移, --apply 后据 canonical 复原"
      - "生效目录内容与 canonical 不一致时报漂移, --apply 后据 canonical 复原"
      - "不由本设施管理的导出技能不被误标记为漂移, 也不被 --apply 触碰(负路径)"
      - "技能正文引用的死绝对路径只产出 finding, 不被自动修复(负路径: 绝对路径不在自动修复范围)"
      - "行内锚点后缀(如 #L123)在做死链检查前会被正确剥离再判定"
    tests:
      - file: ../../../../../tests/domains/test_atlas_health.py
        cases:
          - "test_drift_missing_in_export_dir_then_apply_restores"
          - "test_drift_content_mismatch_then_apply_restores"
          - "test_non_managed_export_skill_not_flagged_or_touched"
          - "test_dead_absolute_path_is_finding_only_not_fixed"
          - "test_dead_ref_line_anchor_suffix_stripped_before_check"
    status: covered

  - id: atlas.health_report_persistence
    what: 技能库健康巡检结果落盘为报告文件, 且能读到最新一份报告(供资源中心查询面消费)
    should:
      - "巡检跑完后报告被写入磁盘"
      - "多份历史报告存在时, 读取接口返回时间最新的一份"
    tests:
      - file: ../../../../../tests/domains/test_atlas_health.py
        cases:
          - "test_report_written_to_disk"
          - "test_latest_health_report_reads_newest"
    status: covered
