  # ── 基础工具函数库(跨界面复用的纯逻辑) ──────────────────────────────────
  - id: lib.ws_auto_reconnect
    what: WebSocket 自动重连(wsAutoReconnect)——首次连接回调、非正常关闭后指数退避重连(封顶 30s)、重连期间发送入队并在恢复后 flush、主动关闭不再重连、长时间掉线后切换为明确的 disconnected 态
    should:
      - "unit: 首次 connect 成功回调 onOpen 且 isReconnect=false"
      - "unit(负路径): server 非 1000 关闭后 1s 左右发起重连尝试"
      - "unit: 退避间隔指数增长直到 30s 上限"
      - "unit: 重连期间调用 send 会入队, 连接恢复后自动 flush"
      - "unit: 主动关闭(code=1000)后状态切 disconnected 且不再重连"
      - "unit(负路径): 累计断线时长超过阈值仍未连上则状态切换为明确的 disconnected"
    tests:
      - file: src/lib/wsAutoReconnect.test.ts
        cases: ["CASE1 首次 connect → onOpen 调一次 isReconnect=false", "CASE2 server close (非 1000) → 1s 后重连尝试", "CASE3 退避指数增长到 30s 上限", "CASE4 reconnecting 期间 send 入队, open 后 flush", "CASE5 主动 close(1000) → state 切 disconnected, 不再重连", "CASE6 累计 longDisconnectMs 仍未连上 → state 切 disconnected"]
    status: covered

