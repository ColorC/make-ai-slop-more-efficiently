# [OMNI] origin=claude-code domain=omnicompany/dashboard/frontend ts=2026-07-04T01:05:00+08:00 type=data
# testmap.yaml — 功能点-测试对照表。真源跟随本仓(dashboard 前端); omnicompany 只注册指针。
# 契约定义: src/omnicompany/packages/services/_governance/testmap.py
# 上位计划: docs/plans/omnicompany-governance/[2026-07-03]FEATURE-TEST-LEDGER/plan.md
#
# W4a 全量反推(试点反推批): 实测 tests/e2e/*.spec.ts 共 36 份 / test( 标题 198 条(不含
# test.describe, 提取脚本见报告); src/ 下与源码同目录 vitest 单元 23 份。features 只登记
# 用 grep 核实过测试锚真实存在的功能点, 不编造。按界面/行为域归组, 一个功能点吸多条 case
# 是常态。保留原有 4 条(quest_board.copy / project_board.kebab_copy_id /
# home_recent.conversation_row_kebab_copy_sid / quest_board.task_pin, 后者仍是故意留空的 gap)。

app: omnidashboard-frontend
doc: TESTING.md
gates:
  - id: e2e
    cmd: npx playwright test
    cwd: .
  - id: unit
    cmd: npm test
    cwd: .

features:
  # ── 任务窗口 / 项目工作板复制链路(既有 4 条, 原样保留) ─────────────────────
  - id: quest_board.copy
    what: 任务窗口计划行与任务线卡头的"复制引用/复制路径", 复制成败均有行内可见反馈
    should:
      - "e2e: 正常浏览器下点复制后剪贴板内容精确等于计划 id/目录路径, 且行内出现「已复制」反馈"
      - "e2e: 受限环境(无 navigator.clipboard, 如 VSCode webview iframe)走 execCommand 降级仍真复制成功, 且反馈可见, 绝不静默无反应"
    tests:
      - file: tests/e2e/quest_copy.spec.ts
        cases: ["复制引用", "复制路径", "受限环境"]
    status: covered

  - id: project_board.kebab_copy_id
    what: 工作板项目卡片右上角三点菜单复制项目 id, 点菜单项不误触发卡片展开
    should:
      - "e2e: 点三点菜单的复制项目 id 项后剪贴板内容非空, 菜单收起且 stopPropagation 生效(未被顶进项目详情页)"
    tests:
      - file: tests/e2e/recent_kebab.spec.ts
        cases: ["项目卡片三点菜单: 复制项目 id, 点菜单不误开卡片"]
    status: covered

  - id: home_recent.conversation_row_kebab_copy_sid
    what: 首页最近访问表对话行的三点菜单复制 session id, 且对话行文本回退展示 prompt(不显示"信息不足"占位)
    should:
      - "e2e: captures 兜底后对话行文本不出现「信息不足」占位, 回退展示 prompt"
      - "e2e: 对话行三点菜单复制 session id 后剪贴板内容非空"
    tests:
      - file: tests/e2e/recent_kebab.spec.ts
        cases: ["最近访问表: 对话行回退显示 prompt(无「信息不足」) + 行内 kebab 复制 session id"]
    status: covered

  - id: quest_board.task_pin
    what: 任务窗口计划行三点菜单的"置顶（排到列表最前）"——置顶后该行应排到列表最前并保留高亮态
    should:
      - "e2e: 点置顶后该任务行排到列表最前, 且视觉上带置顶高亮态"
      - "e2e: 再次点击(取消置顶)后该任务行回到原有排序位置"
    tests:
      - file: tests/e2e/quest_pin.spec.ts
        cases: ["点置顶后该行排到列表最前 + 带置顶高亮态; 再点取消置顶回到原排序"]
    status: covered

  - id: project_board.kebab_layout_regression
    what: 项目卡片三点菜单悬浮层定位不被相邻卡片按钮遮挡(布局回归)
    should:
      - "e2e: 三点菜单触发钮贴住悬浮层且不被相邻卡片按钮盖住"
    tests:
      - file: tests/e2e/recent_kebab.spec.ts
        cases: ["项目卡片三点菜单: 贴住触发钮且不被相邻卡片按钮盖住(悬浮层定位回归)"]
    status: covered

  - id: project_board.homepage_to_detail_flow
    what: 首页即项目工作板——按分组展示卡片, 点卡片进详情(八页签; 2026-07-06 删常用工作选项/新建按钮, 新增技能页签与文件目录树)
    should:
      - "e2e: 首页展示分组卡片, 点卡片能进入项目详情页, 详情页能复制 index 路径"
      - "e2e: 详情页八页签齐(canvas/plans/convos/teams/skills/files/reviews/authored); 常用工作选项与新建计划书按钮不存在"
      - "e2e: 技能页签有过滤框; 文件页签是目录树且有「展示所有目录」开关"
    tests:
      - file: tests/e2e/project_board.spec.ts
        cases: ["首页即项目工作板: 分组卡片 → 详情 → 复制 index 路径"]
    status: covered

  - id: team_recent_board.team_topology_entry
    what: 最近 team 看板的"更多"菜单——列出 team、复制 team id、点开可直达该 team 拓扑图
    should:
      - "e2e: 更多菜单打开后能列出 team 列表, 点复制 id 剪贴板非空, 点开能跳到该 team 拓扑"
    tests:
      - file: tests/e2e/team_recent_board.spec.ts
        cases: ["最近 team 看板: 更多菜单打开 → 列出 team → 复制 id → 点开拓扑"]
    status: covered

  # ── shell 骨架 / 布局 ───────────────────────────────────────────────────
  - id: shell.activity_bar_and_module_switch
    what: 左侧 ActivityBar 四个模块入口可见, 点切换后 Sidebar 内容跟随切换的模块变化
    should:
      - "e2e: ActivityBar 展示 4 个模块入口"
      - "e2e: 切换模块后 Sidebar 内容跟随切到对应模块"
    tests:
      - file: tests/e2e/shell.spec.ts
        cases: ["A1 ActivityBar 4 项可见", "A2 切 module sidebar 跟随"]
    status: covered

  - id: shell.sidebar_filter_and_grouping
    what: Sidebar 标题与过滤框可见, system 模块默认按 Worker/Team/Material 分组, Agent 会话独立成模块
    should:
      - "e2e: Sidebar 标题与过滤输入框均可见"
      - "e2e: system 模块默认分组=Worker/Team/Material, Agent 会话是独立模块不混进 system"
    tests:
      - file: tests/e2e/shell.spec.ts
        cases: ["A3 Sidebar 标题 + 过滤框可见", "A4 实体分组 (system 默认 = Worker / Team / Material; Agent 会话独立模块)"]
    status: covered

  - id: shell.editor_area_default_and_welcome
    what: 中央编辑区默认展示 Welcome 页, Welcome 页含 4 个模块入口卡片
    should:
      - "e2e: 未开任何 tab 时中央区默认显示 Welcome"
      - "e2e: Welcome 页展示 4 个模块入口卡片"
    tests:
      - file: tests/e2e/shell.spec.ts
        cases: ["A6 EditorArea 默认显 Welcome", "A11 Welcome 4 模块卡片可见"]
    status: covered

  - id: shell.bottom_panel_toggle
    what: 底部面板(BottomPanel)默认展开且标签可见, 可在标签间切换
    should:
      - "e2e: 默认打开 BottomPanel 且标签可见"
      - "e2e: 点其他标签能切换 BottomPanel 显示内容"
    tests:
      - file: tests/e2e/shell.spec.ts
        cases: ["A8 BottomPanel 默认开 + 标签可见", "A9 BottomPanel 切换标签"]
    status: covered

  - id: shell.status_bar_and_modal_dismiss
    what: 底部状态栏展示当前打开的标签数与快捷键提示; 弹出的 Modal 能用 Esc 或取消按钮关闭(不留死态)
    should:
      - "e2e: 无 tab 时状态栏显示 0 标签且展示快捷键提示"
      - "e2e: Modal 打开后 Esc 键与取消按钮均能关闭, 不是死锁状态"
    tests:
      - file: tests/e2e/shell.spec.ts
        cases: ["A10 StatusBar 显 0 标签 + 快捷键提示", "A12 Modal Esc 关闭 + 取消按钮关闭"]
    status: covered

  - id: shell.homepage_screenshot_archive
    what: 首页截图存档(视觉回归留痕)
    should:
      - "e2e: 能成功取首页截图并存档, 不报错"
    tests:
      - file: tests/e2e/shell.spec.ts
        cases: ["A_screenshot 取首页截图存档"]
    status: covered

  - id: shell.splitter_resize
    what: Sidebar 与底部面板的分隔条(splitter)可拖拽改变宽高
    should:
      - "e2e: 拖拽 sidebar 右边 splitter 能改变 sidebar 宽度"
      - "e2e: 拖拽 bottom panel splitter 能改变 bottom panel 高度"
    tests:
      - file: tests/e2e/splitter.spec.ts
        cases: ["S1 sidebar 右边 splitter 拖拽 改宽度", "S2 bottom panel splitter 拖拽 改高度"]
    status: covered

  - id: shell.dev_reload_auto_refresh
    what: 开发时后端 ui bump 触发页面自动刷新, 不误动 VSCode 外壳/不重启子进程
    should:
      - "e2e: ui bump 事件触发页面自刷新, 且不动 VSCode/不重启进程"
    tests:
      - file: tests/e2e/dev_reload.spec.ts
        cases: ["ui bump 触发页面自刷新 (不动 VSCode / 不重启进程)"]
    status: covered

  - id: shell.dockview_panel_placement
    what: 驾驶舱工作台(Dockview)新开面板可按请求放到右侧或指定 split 位置, 已开面板可被后续请求移动到新位置
    should:
      - "unit: 新增面板时右侧放置(right placement)请求被正确传给 Dockview"
      - "unit: 已存在的面板在后续收到 split 放置请求时会被移动而不是重开"
    tests:
      - file: src/shell/EditorArea.test.tsx
        cases: ["passes right-side placement to Dockview when adding a new panel", "moves an existing panel when a split placement is requested later"]
    status: covered

  - id: shell.cockpit_shell_entry_points
    what: 驾驶舱壳(CockpitShell)v2-11 版渲染含 workflow 摘要数据, 页内快照按钮、材料台账入口、通知引用打开均接到工作面
    should:
      - "unit: CockpitShell 渲染时带上 workflow 摘要数据"
      - "unit: 页内快照按钮恢复可用(不再只是 poof 提示)"
      - "unit: material registry 与当前活跃计划入口接到工作面, 点开材料台账搜索结果能落进工作面(默认或显式右侧)"
      - "unit: 点通知引用能在工作面打开对应内容"
    tests:
      - file: src/shell/CockpitShell.test.tsx
        cases: ["renders the v2-11 cockpit shell with workflow summary data", "restores the in-page page-snapshot button (no longer just a poof hint)", "keeps material registry and active plan entry points wired to the work surface", "opens material registry search results in the work surface", "opens search results to the right side when explicitly requested", "opens notification refs in the work surface"]
    status: covered

  - id: shell.panels_store_tab_lifecycle
    what: 面板状态仓(panelsStore)固定 tab(工作板/任务/总控)不可被普通关闭动作误关, 布局恢复/拆分放置请求均能正确合并
    should:
      - "unit: 初始状态固定含工作板首页 + 任务 + 总控三个 tab"
      - "unit: 关闭动作不会关掉固定的总控 tab, 但能关掉普通 tab"
      - "unit: 从存档恢复布局时固定 tab 会被正确合并进恢复结果"
      - "unit: 显式 split 停靠请求在恢复后仍被保留"
      - "unit: review_material 是多实例 tab(每条材料一个页签, 重开同材料只聚焦), review_queue 是单例 tab(不同材料公用一个 tab 并更新聚焦 id)"
    tests:
      - file: src/stores/panelsStore.test.ts
        cases: ["starts with the fixed project board (homepage) + quest + controller tabs", "does not close the fixed controller tab but closes normal tabs", "merges the fixed tabs into restored layouts", "keeps explicit dock placement requests for split monitoring", "review_material 是多实例 tab", "review_queue 是单例 tab"]
    status: covered

  - id: shell.tab_maximize_and_context_menu
    what: tab 最大化/还原(reviewMaximizeStore)与 tab 右键菜单——最大化已知 tab 生效、未知 tab 不进入最大化态、dockview 外部丢弃最大化分组时状态能对齐、菜单开关不与最大化互相打架
    should:
      - "unit: 最大化一个已知 tab 会激活它、调用 dockview maximize、记录其 id"
      - "unit: 对未知 tab 调用最大化不会进入最大化态(不可判定的 tab 直接忽略)"
      - "unit: 退出最大化会调用 dockview exit 并清空已记录的最大化 id"
      - "unit: dockview 在外部丢弃最大化分组(如 tab 被关闭)后状态能对账复位"
      - "unit: tab 右键上下文菜单能正常开关"
      - "unit: 触发最大化会关闭任何已打开的 tab 菜单"
    tests:
      - file: src/stores/reviewMaximizeStore.test.ts
        cases: ["maximizes a known tab: activates it, calls dockview maximize, records the id", "ignores maximize for an unknown tab without entering maximized state", "exit calls dockview exit and clears the maximized id", "reconciles when dockview drops its maximized group externally (e.g. tab closed)", "opens and closes the tab context menu", "maximizing closes any open tab menu"]
    status: covered

  # ── 命令面板 / 深链 ─────────────────────────────────────────────────────
  - id: cmdk.command_palette_search_and_navigate
    what: Ctrl+K 命令面板——触发、按名搜索(worker/note/PM 均可命中)、分组展示、Enter 打开、Esc 关闭
    should:
      - "e2e: Ctrl+K 能触发命令面板打开"
      - "e2e: 输入 worker/PROGRESS 等关键字能命中对应候选(worker section / note)"
      - "e2e: 候选按 WORKER/NOTE/PM 总览等 section 分组展示"
      - "e2e: Enter 选中项能打开对应 tab"
      - "e2e: Esc 能关闭命令面板"
    tests:
      - file: tests/e2e/cmdk.spec.ts
        cases: ["F1 Ctrl+K 触发命令面板", "F2 输入 worker 名 — 出 worker section + 候选", "F3 输入 PROGRESS — 命中 note", "F4 section 分组 (WORKER / NOTE / PM 总览)", "F5 Enter 选中项目开 tab", "F6 Esc 关闭命令面板"]
    status: covered

  - id: deeplink.layout_persist_and_restore
    what: 深链与布局持久化——开关 tab 反映到 URL 的 layout 参数, 重新载入 URL 能恢复单/多 tab 布局
    should:
      - "e2e: 开 tab 后 URL 出现 layout 参数, 关闭全部 tab 后 layout 参数消失"
      - "e2e: 携带 layout 参数重新载入页面能恢复单 tab 或多 tab(worker+note)布局"
    tests:
      - file: tests/e2e/deeplink.spec.ts
        cases: ["F7 开 tab 后 URL 含 layout 参数", "F8 关所有 tab 后 URL 不含 layout", "F9 重新载入 URL 恢复 1 tab", "F10 重新载入 URL 恢复多 tab (worker + note)"]
    status: covered

  - id: routing.entry_route_normalization
    what: 入口路由归一化——不同历史入口链接(纯 OmniChat/完整 chat session/老 review-stage 链接)都能映射到驾驶舱正确落点, 内嵌聊天与老 chat 链接保持独立不被误吞并
    should:
      - "unit: 默认根路径保持驾驶舱壳"
      - "unit: 供 iframe 使用的内嵌聊天入口保持独立不被路由吞并"
      - "unit: 显式请求老 chat 入口时仍保持独立"
      - "unit: 纯 OmniChat 入口被归一化转成驾驶舱壳"
      - "unit: 完整 chat session 链接被映射为驾驶舱 cc_session 深链"
      - "unit: 老 review-stage 材料链接映射为驾驶舱 review_material 深链"
      - "unit: 裸 review-stage 链接(无参数)映射为驾驶舱审阅队列深链"
    tests:
      - file: src/routes/entryRoute.test.ts
        cases: ["keeps the cockpit shell as the default root", "keeps embedded chat standalone for iframe consumers", "keeps legacy chat standalone when explicitly requested", "turns plain OmniChat entry into the cockpit shell", "turns full chat session links into cockpit cc_session deep links", "maps legacy review-stage material links to the cockpit review_material deeplink", "maps bare review-stage links to the cockpit review queue"]
    status: covered

  - id: audit.zero_404_sweep
    what: 5 大模块切换与内部深入浏览(KB 树+笔记、PM 计划+plan.md、System 各实体、Settings、Trace、KB 内 .md 链接全量)全程零 404、零 console.error
    should:
      - "e2e: 5 模块之间切换零 404 / 零 console.error"
      - "e2e: KB 模块树+第一条 note 打开零 404"
      - "e2e: PM 模块第一条 plan 展开+打开 plan.md 零 404"
      - "e2e: System 模块 Worker/Team/Material 各开第一条零 404"
      - "e2e: Settings 模块零 404"
      - "e2e: Trace 列表点开第一条零 404"
      - "e2e(负路径/体检): kb_markdown_demo 内每个 .md 链接逐个点开都不 404"
    tests:
      - file: tests/e2e/audit_404_sweep.spec.ts
        cases: ["AUDIT.1 5 模块切换零 404 / 零 console.error", "AUDIT.2 KB 模块 — 树+第一条 note 开启零 404", "AUDIT.3 PM 模块 — 第一条 plan 开启 + plan.md 打开零 404", "AUDIT.4 System 模块 — Worker / Team / Material 各开第一条零 404", "AUDIT.5 Settings 模块零 404", "AUDIT.6 Trace 列表点开第一条零 404", "AUDIT.7 kb_markdown_demo 内每个 .md 链接都不 404"]
    status: covered

  # ── KB 笔记: 渲染 ────────────────────────────────────────────────────────
  - id: kb.sidebar_list_and_open_note
    what: KB sidebar 以树形展示 note 列表(真后端数据), 点 note 能开 tab 渲染真实 markdown, 过滤框能按关键字缩小列表
    should:
      - "e2e: sidebar 树形展示 note 列表(数据来自真后端 /api/notes)"
      - "e2e: 点 note 打开对应 tab"
      - "e2e: note tab 渲染真实 markdown(h1/段落等)"
      - "e2e: 过滤输入生效, 列表按关键字缩小"
    tests:
      - file: tests/e2e/kb.spec.ts
        cases: ["B1 KB sidebar 显 note 列表 (真后端 /api/notes, 树形)", "B2 点 note 开 tab", "B3 Note tab 真 markdown 渲染 (h1 / 段落)", "B_filter Note 过滤生效"]
    status: covered

  - id: kb.markdown_render_basic_and_gfm
    what: markdown 渲染覆盖标题/行内格式/列表(含 GFM 任务列表)/表格/引用(含 Obsidian callout 四类型)/代码高亮/Mermaid/KaTeX/水平线, 并留存整体与分区截图
    should:
      - "e2e: 标题(H1/H2)渲染且带底边线"
      - "e2e: 行内格式(粗体/斜体/删除线/行内 code)正确渲染"
      - "e2e: 无序/有序列表与 GFM 任务列表(checkbox)正确渲染"
      - "e2e: GFM 表格渲染出 table/th/td/border"
      - "e2e: 普通 blockquote 与 Obsidian callout(note/warning/tip/danger 四类型)都能识别渲染"
      - "e2e: 代码块按语言(python/typescript)独立语法高亮"
      - "e2e: Mermaid 图渲染为 SVG"
      - "e2e: KaTeX 行内与块级数学公式渲染"
      - "e2e: 水平线(hr)渲染"
      - "e2e(截图留档): 综合观感、markdown-body 内部、表格+callout 区、代码+mermaid+math 区分别截图存档"
