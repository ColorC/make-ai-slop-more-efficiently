&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;anniv-balance-distribution&#x27;);
  const data = JSON.parse(document.getElementById(&#x27;anniv-balance-data&#x27;).textContent);
  const NS = &#x27;http://www.w3.org/2000/svg&#x27;;
  const seriesVars = [&#x27;--viz-series-1&#x27;, &#x27;--viz-series-2&#x27;, &#x27;--viz-series-3&#x27;, &#x27;--viz-series-4&#x27;, &#x27;--viz-series-5&#x27;];
  const compact = new Intl.NumberFormat(&#x27;zh-CN&#x27;, { notation: &#x27;compact&#x27;, maximumFractionDigits: 1 });
  const integer = new Intl.NumberFormat(&#x27;zh-CN&#x27;);
  const scoreTicks = [0, 10000, 30000, 100000, 300000, 1000000, 3000000, 10000000];

  function el(name, attrs = {}, text = &#x27;&#x27;) {
    const node = document.createElementNS(NS, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
    if (text) node.textContent = text;
    return node;
  }

  function makeSvg(container, height, label, description) {
    container.replaceChildren();
    const width = Math.max(320, Math.round(container.getBoundingClientRect().width || root.getBoundingClientRect().width || 736));
    const svg = el(&#x27;svg&#x27;, { class: &#x27;anniv-chart&#x27;, viewBox: `0 0 ${width} ${height}`, role: &#x27;img&#x27;, &#x27;aria-label&#x27;: label });
    svg.append(el(&#x27;title&#x27;, {}, label), el(&#x27;desc&#x27;, {}, description));
    container.append(svg);
    return { svg, width, height };
  }

  function scoreScale(value, left, right, maxScore) {
    const offset = 10000;
    return left + (Math.log(value + offset) - Math.log(offset)) / (Math.log(maxScore + offset) - Math.log(offset)) * (right - left);
  }

  function addScoreAxis(svg, y, left, right, maxScore) {
    svg.append(el(&#x27;line&#x27;, { x1: left, y1: y, x2: right, y2: y, class: &#x27;anniv-axis&#x27; }));
    for (const tick of scoreTicks.filter((x) =&gt; x &lt;= maxScore * 1.02)) {
      const x = scoreScale(tick, left, right, maxScore);
      svg.append(el(&#x27;line&#x27;, { x1: x, y1: y, x2: x, y2: y + 5, class: &#x27;anniv-axis&#x27; }));
      const anchor = tick === 0 ? &#x27;start&#x27; : (tick &gt;= maxScore * 0.9 ? &#x27;end&#x27; : &#x27;middle&#x27;);
      svg.append(el(&#x27;text&#x27;, { x, y: y + 18, &#x27;text-anchor&#x27;: anchor, class: &#x27;anniv-tick&#x27; }, tick === 0 ? &#x27;0&#x27; : compact.format(tick)));
    }
  }

  function renderFactionHistogram() {
    const container = document.getElementById(&#x27;faction-histogram&#x27;);
    const facetHeight = 86;
    const top = 8;
    const bottom = 28;
    const { svg, width } = makeSvg(container, top + data.strategies.length * facetHeight + bottom, &#x27;各流派终局分数分布&#x27;, &#x27;五种策略各一千局的同尺度对数直方图，并标注中位数与九十分位。&#x27;);
    const left = width &lt; 520 ? 62 : 82;
    const right = width - 10;
    const maxScore = data.overall.max;
    const maxPct = Math.max(...data.strategies.flatMap((s) =&gt; s.histogram));

    data.strategies.forEach((strategy, index) =&gt; {
      const yTop = top + index * facetHeight;
      const baseline = yTop + 62;
      const color = `var(${seriesVars[index]})`;
      svg.append(el(&#x27;text&#x27;, { x: 0, y: yTop + 18, class: &#x27;anniv-label&#x27; }, strategy.label));
      svg.append(el(&#x27;text&#x27;, { x: left, y: yTop + 18, class: &#x27;anniv-note&#x27; }, `P50 ${compact.format(strategy.p50)} · P90 ${compact.format(strategy.p90)} · 均值 ${compact.format(strategy.mean)}`));
      svg.append(el(&#x27;line&#x27;, { x1: left, y1: baseline, x2: right, y2: baseline, class: &#x27;anniv-grid&#x27; }));

      strategy.histogram.forEach((pct, bin) =&gt; {
        const x0 = scoreScale(data.edges[bin], left, right, maxScore);
        const x1 = scoreScale(data.edges[bin + 1], left, right, maxScore);
        const height = pct / maxPct * 36;
        const rect = el(&#x27;rect&#x27;, { x: x0, y: baseline - height, width: Math.max(1, x1 - x0 - 1), height, class: &#x27;anniv-bar&#x27;, style: `--series:${color}` });
        rect.append(el(&#x27;title&#x27;, {}, `${strategy.label} · ${compact.format(data.edges[bin])}–${compact.format(data.edges[bin + 1])}：${pct}%`));
        svg.append(rect);
      });

      const medianX = scoreScale(strategy.p50, left, right, maxScore);
      const p90X = scoreScale(strategy.p90, left, right, maxScore);
      svg.append(el(&#x27;line&#x27;, { x1: medianX, y1: yTop + 23, x2: medianX, y2: baseline, class: &#x27;anniv-marker&#x27;, style: `--series:${color}` }));
      svg.append(el(&#x27;line&#x27;, { x1: p90X, y1: yTop + 29, x2: p90X, y2: baseline, class: &#x27;anniv-marker&#x27;, &#x27;stroke-dasharray&#x27;: &#x27;3 3&#x27;, style: `--series:${color}` }));
    });
    addScoreAxis(svg, top + data.strategies.length * facetHeight, left, right, maxScore);
  }

  function renderOverallHistogram() {
    const container = document.getElementById(&#x27;overall-histogram&#x27;);
    const { svg, width, height } = makeSvg(container, 240, &#x27;整体游玩分数分布&#x27;, &#x27;五千局合并分布，中位数四万一千，九十分位十四万六千，保留一个接近九百八十七万的低频长尾。&#x27;);
    const left = width &lt; 520 ? 46 : 58;
    const right = width - 12;
    const top = 30;
    const baseline = height - 34;
    const maxPct = Math.max(...data.overall.histogram);
    const maxScore = data.overall.max;

    data.overall.histogram.forEach((pct, bin) =&gt; {
      const x0 = scoreScale(data.edges[bin], left, right, maxScore);
      const x1 = scoreScale(data.edges[bin + 1], left, right, maxScore);
      const barHeight = pct / maxPct * (baseline - top);
      const rect = el(&#x27;rect&#x27;, { x: x0, y: baseline - barHeight, width: Math.max(1, x1 - x0 - 1), height: barHeight, class: &#x27;anniv-bar&#x27;, style: &#x27;--series:var(--viz-series-1)&#x27; });
      rect.append(el(&#x27;title&#x27;, {}, `${compact.format(data.edges[bin])}–${compact.format(data.edges[bin + 1])}：${pct}%`));
      svg.append(rect);
    });

    const markers = [
      [&#x27;P50&#x27;, data.overall.p50, &#x27;&#x27;],
      [&#x27;P90&#x27;, data.overall.p90, &#x27;4 3&#x27;],
    ];
    for (const [label, value, dash] of markers) {
      const x = scoreScale(value, left, right, maxScore);
      svg.append(el(&#x27;line&#x27;, { x1: x, y1: top, x2: x, y2: baseline, class: &#x27;anniv-marker&#x27;, &#x27;stroke-dasharray&#x27;: dash, style: &#x27;--series:var(--viz-series-2)&#x27; }));
      svg.append(el(&#x27;text&#x27;, { x: x + 4, y: top + (label === &#x27;P50&#x27; ? 12 : 27), class: &#x27;anniv-label&#x27; }, `${label} ${compact.format(value)}`));
    }
    const maxStrategy = data.strategies.reduce((a, b) =&gt; a.max &gt; b.max ? a : b);
    svg.append(el(&#x27;text&#x27;, { x: right, y: top + 12, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;anniv-note&#x27; }, `最高 ${compact.format(data.overall.max)}（${maxStrategy.label}）`));
    addScoreAxis(svg, baseline, left, right, maxScore);
  }

  function renderLegend(containerId, entries) {
    const container = document.getElementById(containerId);
    container.replaceChildren();
    entries.forEach((entry, index) =&gt; {
      const item = document.createElement(&#x27;span&#x27;);
      item.className = &#x27;anniv-legend-item&#x27;;
      const swatch = document.createElement(&#x27;span&#x27;);
      swatch.className = &#x27;anniv-swatch&#x27;;
      swatch.style.setProperty(&#x27;--swatch&#x27;, `var(${seriesVars[index]})`);
      const label = document.createElement(&#x27;span&#x27;);
      label.textContent = entry;
      item.append(swatch, label);
      container.append(item);
    });
  }

  function renderCurves(containerId, series, label, description, logY = false) {
    const container = document.getElementById(containerId);
    const { svg, width, height } = makeSvg(container, 300, label, description);
    const left = width &lt; 520 ? 50 : 62;
    const right = width - 16;
    const top = 14;
    const bottom = height - 34;
    const yMax = Math.max(...series.flatMap((s) =&gt; s.values));
    const x = (round) =&gt; left + (round - 1) / (data.rounds - 1) * (right - left);
    const y = logY
      ? (value) =&gt; bottom - Math.log1p(value) / Math.log1p(yMax) * (bottom - top)
      : (value) =&gt; bottom - value / yMax * (bottom - top);

    const yTicks = logY
      ? [0, 1000, 3000, 10000, 30000, 100000, 300000].filter((v) =&gt; v &lt;= yMax)
      : Array.from({ length: 5 }, (_, i) =&gt; Math.round(yMax * i / 4));
    for (const tick of yTicks) {
      const yy = y(tick);
      svg.append(el(&#x27;line&#x27;, { x1: left, y1: yy, x2: right, y2: yy, class: &#x27;anniv-grid&#x27; }));
      svg.append(el(&#x27;text&#x27;, { x: left - 6, y: yy + 4, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;anniv-tick&#x27; }, compact.format(tick)));
    }
    for (const round of [1, 6, 12, 18, 24]) {
      const xx = x(round);
      svg.append(el(&#x27;line&#x27;, { x1: xx, y1: bottom, x2: xx, y2: bottom + 5, class: &#x27;anniv-axis&#x27; }));
      svg.append(el(&#x27;text&#x27;, { x: xx, y: bottom + 19, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;anniv-tick&#x27; }, `R${round}`));
    }
    svg.append(el(&#x27;line&#x27;, { x1: left, y1: bottom, x2: right, y2: bottom, class: &#x27;anniv-axis&#x27; }));

    series.forEach((entry, index) =&gt; {
      const color = `var(${seriesVars[index]})`;
      const d = entry.values.map((value, i) =&gt; `${i ? &#x27;L&#x27; : &#x27;M&#x27;}${x(i + 1).toFixed(2)},${y(value).toFixed(2)}`).join(&#x27; &#x27;);
      svg.append(el(&#x27;path&#x27;, { d, class: &#x27;anniv-line&#x27;, style: `--series:${color}`, &#x27;stroke-dasharray&#x27;: entry.dash || &#x27;&#x27; }));
      entry.values.forEach((value, i) =&gt; {
        const point = el(&#x27;circle&#x27;, { cx: x(i + 1), cy: y(value), r: i === entry.values.length - 1 ? 3 : 1.5, class: &#x27;anniv-point&#x27;, style: `--series:${color}` });
        point.append(el(&#x27;title&#x27;, {}, `${entry.name} · 第 ${i + 1} 回合：${integer.format(value)}`));
        svg.append(point);
      });
    });
  }

  function draw() {
    renderFactionHistogram();
    renderOverallHistogram();
    renderLegend(&#x27;median-legend&#x27;, data.strategies.map((s) =&gt; `${s.label} · R24 ${compact.format(s.p50)}`));
    renderCurves(
      &#x27;median-curves&#x27;,
      data.strategies.map((s) =&gt; ({ name: s.label, values: s.medianCurve })),
      &#x27;各流派逐回合中位数曲线&#x27;,
      &#x27;五种策略分别对每个回合取一千局的累计分中位数，显示典型成型节奏。&#x27;
    );
    renderLegend(&#x27;representative-legend&#x27;, data.representative.map((r) =&gt; `${r.name} · ${r.strategyLabel} · ${compact.format(r.final)}`));
    renderCurves(
      &#x27;representative-curves&#x27;,
      data.representative.map((r, i) =&gt; ({ name: `${r.name}（${r.strategyLabel}）`, values: r.curve, dash: i === 1 ? &#x27;&#x27; : (i === 0 ? &#x27;3 3&#x27; : &#x27;7 3&#x27;) })),
      &#x27;真实 P25、P50、P90 代表局逐回合累计分&#x27;,
      &#x27;三条曲线是实际对局。P90 代表局在第十九回合完成关键链并出现主要跃升。&#x27;
    );
  }

  let pending = 0;
  const observer = new ResizeObserver(() =&gt; {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(draw);
  });
  observer.observe(root);
  draw();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
