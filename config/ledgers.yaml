# 账本位置登记表 — 记录类内容落点闭集的唯一权威源
# 铁律: 记录类内容(操作留痕/审批/进度/决策/日志/会话登记等一切"追加式事实记录")
#       只允许存在于本表登记的位置; 表外出现记录类文件 = 违规。
# 每类记录一个头(同一类事实只应有一个唯一真源, 其余要么是只读派生要么是违规多头)。
# 新增记录类型时, 在本表加一行即合法 —— 闭集可低摩擦扩容, 不必先大改造再登记。
# 记录工具本身不接受路径参数(写死登记位置), 想写别处只能绕过工具, 绕过即违规。
# 权威依据: docs/plans/[2026-07-02]SEMANTIC-OS-MAP/target-architecture.md 第 3.5 节。
# 普查底料: docs/plans/[2026-07-02]SEMANTIC-OS-MAP/design-candidates/fact-records-census.md。

meta:
  updated: "2026-07-02"
  note: 重整第一批·闭集登记之二(第一条闭集登记是 config/ports.yaml)。

# 字段说明:
#   id: 记录类型短标识
#   名称: 人话描述
#   位置: 绝对路径或仓内相对路径(相对路径以 omnicompany/ 为根, 另注明的除外)
#   格式: 文件/存储格式
#   谁在写: 写入方(服务/CLI/角色)
#   唯一性: 唯一真源 | 只读派生 | 多头待收敛 | 待修死
#   保留滚动策略: { 现状, 目标 }
#   备注: 关联条目/已知问题/待核事项

