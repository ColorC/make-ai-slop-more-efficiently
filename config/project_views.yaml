# 应用视图(项目双视图·桌面端)的启动器条目 —— 类安卓启动器, 每格只有图标 + 名字。
# 收录长期审阅面 / 常用工作入口, 与项目卡片相互独立(项目卡走注册表, 这里是手挑的常用站)。
#
# 消费: dashboard GET /api/project-views 读本文件, 返回 { apps: [...] }; 缺文件时返回 { apps: [] }。
# 前端应用视图点击某格 = window.open(url)。
# url 约定: 站内同源反代路径(如 /walker-game/)优先, 无反代的服务用本机端口地址。
#   每条 url 都在 dashboard app.py 的 _HOSTED_APPS / 反代路由或 config/ports.yaml 里可核实。
# icon_url: 专属图标(aigc-lab 生成, 氛围主题图(与项目卡图同路数), 存 project_assets 平铺文件名, ?v= 破缓存);
#   前端优先 icon_url, 缺失回退 icon(emoji)。
apps:
  - id: walker-demo
    label: 行者无乡 demo
    icon: "🎮"
    icon_url: /api/project-assets/appicon-walker-demo.png?v=2
    url: /walker-game/           # dashboard 同源反代 → walker-game vite dev(可玩入口)
  - id: voxelcraft-console
    label: MC 控制台
    icon: "🧱"
    icon_url: /api/project-assets/appicon-mc-console.png?v=2
    url: /voxelcraft/            # dashboard 同源反代 → voxelcraft 检阅台(proto-world console)
  - id: aigc-review
    label: aigc 审阅台
    icon: "🎨"
    icon_url: /api/project-assets/appicon-aigc-review.png?v=2
    url: http://localhost:8077/  # webworks aigc-lab 审阅台(ports.yaml:8077, 无反代)
  - id: aiworkspace-portal
    label: AIWorkspace 网站
    icon: "🌐"
    icon_url: /api/project-assets/appicon-aiworkspace.png?v=2
    url: http://localhost:47823/ # AIWorkSpace App Portal(ports.yaml:47823)
  - id: bilibili-workbench
    label: 发布工作台
    icon: "📺"
    icon_url: /api/project-assets/appicon-bilibili-workbench.png?v=1
    url: /?open_type=studio_reader&open_id=bilibili-publish  # 驾驶舱内 deeplink → bilibili-publish 材料树(九层级 StudioReader)
  - id: bilibili-write
    label: 写稿台
    icon: "✍️"
    url: /bilibili-write/ep00-meta-first  # 当前期写稿页(远程编辑自动存回服务器); 换期后指向新 episode
